component_affected=see GHSA-q6r4-3wmg-fwcq
component_fixed=VERIFY  # confirm fixed Podman/libpod version from the advisory
what=CVE-2026-55686 is a symlink-following flaw in Podman/libpod. Running a malicious container image whose WORKDIR path contains a symlink can cause Podman, during host-side working-directory creation, to create a directory at the symlink target on the host filesystem. Ownership of an existing host path can also be modified, though that variant additionally requires a race with an untrusted/malicious process mutating the host filesystem tree during dereferencing of the WORKDIR path.
impact=Limited host filesystem integrity impact: attacker-influenced directory creation on the host, and (race-dependent) ownership changes of host paths. The attacker controls the target path but not arbitrary file contents, bounding the severity. Same general class as the runc /dev symlink and masked-path races.
exploit=Low. Directory creation is reliable given a crafted image; the ownership-modification variant needs a host-side race and is described as less likely. No public weaponised PoC. CVSS ~5.3.
rec=1) Upgrade Podman/libpod to the fixed release (confirm version from GHSA-q6r4-3wmg-fwcq). 2) Run only trusted images; treat images with symlinked WORKDIR as suspicious. 3) The behavioural class is covered by check_runc_masked_path (symlink/masked-path races) and by the writable-core_pattern / sensitive-mount checks.
notes=check_type=manual userspace runtime CVE. component_fixed=VERIFY — populate from the advisory once the fixed Podman version is confirmed.

