mitigation=No drop-in software mitigation — patch the kernel. Interim: restrict arm64 KVM hosts to trusted guests/tenants only, and do not expose /dev/kvm to application containers.
socket_af=none
socket_type=none
socket_proto=none
arch=arm64  # Architecture gate (enforced by the engine): only arm64/aarch64 hosts are tested; on other arches this CVE is reported N/A
what=ITScape (CVE-2026-46316) is a use-after-free in the Linux kernel KVM implementation for arm64, in the virtual GIC Interrupt Translation Service (vgic-its). A race condition during concurrent interrupt-translation cache invalidation causes vgic_its_invalidate_cache() to drop the cache's reference count twice (a double-put). A malicious guest can drive the race to corrupt host kernel memory and execute code at host kernel privilege. The flaw lives entirely in arch/arm64/kvm/vgic/ (in-kernel KVM), unlike the common QEMU userspace escapes. Discovered by Hyunwoo Kim (V4bel); reported to security@kernel.org; fixed in mainline commit 13031fb6b835 (drops the cache reference only on the value returned by xa_erase()).
impact=Full guest-to-host escape with host kernel (root) privileges on arm64 KVM hosts. Breaks the core guest/host isolation boundary of virtualization. The highest-risk configuration is multi-tenant arm64 public cloud, where untrusted tenants control their own guest VMs. Exploitation requires guest root (EL1) — normally satisfied when a tenant controls their instance; otherwise it can be chained with a guest-side LPE such as Dirty Frag. In container contexts this is relevant where Kata Containers or other VM-isolated runtimes run on arm64 KVM hosts: a compromised microVM guest can reach the host kernel.
exploit=High on affected arm64 KVM hosts. Public PoC released by the researcher demonstrating a full escape chain (2-ITS exploit, vGIC-ITS cache double-put UAF -> host kernel code execution). CVSS 9.3. x86 and non-KVM arm64 systems are unaffected.
rec=1) Apply a kernel containing mainline fix commit 13031fb6b835 (and the related CVE-2026-46317 / follow-up commits). On Rocky/RLC: update to the patched RLC Pro LTS 9.6 / RLC Pro 9 / RLC Pro 10 kernels. 2) There is no drop-in software mitigation — the exploitable code is the emulated ITS inside the arm64 KVM vGIC, reached from a guest. 3) Until patched, restrict arm64 KVM hosts to guests and tenants you trust; prioritise multi-tenant arm64 virtualization for patching. 4) Cloud tenants on arm64 hardware should confirm patch status with their provider.
notes=arm64-only. Rocky Linux 8 is not affected (vulnerable vgic-its code absent). The arch=arm64 key is enforced by the CVE engine's architecture gate: on non-arm64 hosts this entry is reported as N/A (INFO) rather than flagged on kernel version alone. On arm64/aarch64 hosts the kernel_version test runs normally. introduced=6.9 approximates commit 8201d1028caa (2024-04-25); verify against your kernel's actual vgic-its code. The dedicated script check_kvm_arm64_vgic_its provides a complementary architecture-aware behavioural signal (host vs guest vantage point).

# -----------------------------------------------------------------------------
# io_uring zcrx freelist OOB write — CVE-2026-43121
# oss-security CVE request 2026-05-03 (Mohamed salem Eddah); NVD later assigned
# CVE-2026-43121 to the user_ref race fix. Race in io_zcrx_put_niov_uref():
# non-atomic check-then-decrement unserialized vs atomic_xchg in scrub path.
# On SMP, a niov is pushed to the freelist twice -> free_count exceeds nr_iovs
# -> u32 OOB write past the kvmalloc'd freelist array into adjacent slab.
# Fix: commit 003049b1c4fb (atomic_try_cmpxchg loop), backported to 6.18.16.
# No confirmed public PoC of full LPE (blog writeup + exploit files exist but
# provenance disputed on the thread). Requires io_uring zcrx reachability.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-43121
name=io_uring zcrx Freelist OOB
alias=zcrx-oob io_uring-zcrx
cvss=7.0  # VERIFY final NVD score
severity=HIGH
check_type=kernel_version
introduced=6.15  # VERIFY: io_uring zcrx (zero-copy rx) landed ~6.15; confirm against your tree
fixed_versions=6.18:6.18.16 mainline:6.18.16  # VERIFY per-series backports; fix commit 003049b1c4fb
itw=no
poc_public=no  # disputed AI-generated writeup/exploit files referenced on oss-security; treat as unconfirmed
cisa_kev=no
subsystem=io_uring/zcrx
module_names=none
mitigation=Set sysctl kernel.io_uring_disabled=2 to disable io_uring for all unprivileged tasks (or =1 for unprivileged only), or block io_uring_setup/io_uring_enter/io_uring_register via seccomp. See also script check_io_uring_exposure.
socket_af=none
socket_type=none
socket_proto=none
what=CVE-2026-43121 is a race condition in the Linux kernel io_uring zero-copy receive (zcrx) subsystem. io_zcrx_put_niov_uref() used a non-atomic read-then-decrement on user_refs, serialized against other callers by rq_lock, but io_zcrx_scrub() modified the same counter with atomic_xchg() without holding rq_lock. On SMP systems the scrub and refill paths can race, pushing a network I/O vector (niov) onto the freelist twice; free_count then exceeds nr_iovs and subsequent freelist pushes write a u32 value out of bounds past the kvmalloc'd freelist array into the adjacent slab object. Fixed by commit 003049b1c4fb replacing the read-then-dec with an atomic_try_cmpxchg loop (backported to stable 6.18.16).
impact=Out-of-bounds write into adjacent kernel slab memory, leading to potential privilege escalation or kernel memory corruption. Any process able to reach io_uring zcrx functionality on an SMP system can trigger the race. In containers where io_uring is not disabled, an unprivileged container process may be able to reach the primitive.
exploit=Unconfirmed. The oss-security thread mixed a confirmed race/double-return/u32-OOB analysis with an AI-generated report and a disputed exploitation blog post (ze3tar.github.io). Treat the underlying race as real and the OOB write as confirmed; treat 'working public LPE PoC' as unverified. Requires io_uring + zcrx reachable and an SMP host.
rec=1) Update to a kernel containing the user_ref race fix (stable 6.18.16+ or your distribution's backport of commit 003049b1c4fb). Do not rely on blog-post dates — verify the running kernel after reboot is the fixed build. 2) Reduce io_uring attack surface where it is not required: set kernel.io_uring_disabled=2 (disables io_uring_setup(2) for all tasks lacking CAP_SYS_ADMIN as configured) or block io_uring_setup/io_uring_enter/io_uring_register via seccomp. 3) See script check_io_uring_exposure for a behavioural reachability probe.
notes=NVD assigned CVE-2026-43121 to commit 003049b1c4fb 'io_uring/zcrx: fix user_ref race between scrub and refill paths'. introduced/fixed_versions are marked VERIFY — confirm the zcrx code-introduction version and per-series backports against Red Hat / Debian trackers. A later defensive freelist bounds-check commit is also relevant. The dedicated script check_io_uring_exposure tests io_uring_setup(2) reachability independent of this version data.

