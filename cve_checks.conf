what=CVE-2026-46331 (pedit COW) is a partial copy-on-write page-cache corruption flaw in the Linux kernel net/sched traffic-control subsystem, in the act_pedit action used by tc to rewrite packet header bytes in flight. tcf_pedit_act() calls skb_ensure_writable() a single time before the key loop, deriving the writable range from tcfp_off_max_hint — a static hint that omits the runtime header offset added when a typed key resolves its target at execution time. Writes inside the loop can therefore land outside the COW'd region, mutating bytes in a page still shared with the page cache. The upstream fix moves skb_ensure_writable() inside the per-key loop, adds overflow checking on the offset arithmetic, uses skb_cow() for negative (e.g. ingress Ethernet) offsets, and guards offset_valid() against INT_MIN. Introduced by commit 899ee91156e5; fix commits 899ee91156e5 2bec122b9fb9 3dee9d0c198f b198ed4e5258.
impact=Any unprivileged local user gains a root shell on affected systems where the act_pedit action is reachable. The public PoC poisons the page-cached image of setuid-root /bin/su (overwriting its ELF entry point with setgid(0)+setuid(0)+execve("/bin/sh") shellcode) and walks straight to root. As with the other page-cache-poisoning bugs, the on-disk binary is unchanged so file-integrity tooling does not detect tampering, and the shared page cache makes this a container-escape / node-compromise vector on multi-tenant hosts, Kubernetes nodes, and CI/CD runners.
exploit=High in practice despite the bug surfacing as a "routine data-corruption" netdev patch with no security framing. A public, author-verified PoC ("packet_edit_meme") appeared on GitHub within 24 hours of CVE assignment on 2026-06-16. Exploitation needs CAP_NET_ADMIN to configure the tc pedit rule — but this is reachable by unprivileged users via namespace-local CAP_NET_ADMIN where unprivileged user namespaces are enabled (default on Debian/Ubuntu). Deterministic page-cache write, no race. This is an N-day: exploitable detail was on a public mailing list before most teams had a CVE, advisory, or patch.
rec=1) Install the patched distribution kernel and REBOOT (upstream fixed in v7.1-rc7; verify against your vendor advisory: RHEL RHSA-2026:27288 (10) / 27789 (9) / 27353 (8), Debian DSA-6355-1 for Trixie). Confirm with 'uname -r' and ensure container/CI/VM hosts run the updated host kernel. 2) Interim: act_pedit auto-loads the moment a pedit tc action is referenced, so a plain blacklist is insufficient — use an install override: 'echo install act_pedit /bin/true > /etc/modprobe.d/disable-act_pedit.conf' (plus 'rmmod act_pedit' if currently loaded). Most hosts run no tc pedit rules and can disable it safely. 3) Defence-in-depth: disable unprivileged user namespaces ('kernel.unprivileged_userns_clone=0' on Debian/Ubuntu, 'user.max_user_namespaces=0' on RHEL) to remove the namespace-local CAP_NET_ADMIN path — breaks rootless containers and browser sandboxes. 4) Treat any host suspected of running the exploit as fully compromised regardless of file-integrity results.
notes=Same page-cache-poisoning outcome as Copy Fail (CVE-2026-31431) and the DirtyFrag family, but a separate subsystem (tc act_pedit) and separate module gate (act_pedit), so it warrants its own entry rather than coverage by the esp4/esp6/rxrpc blacklist. CVSS confirmed as CVSS v4.0 base 8.5 (Ubuntu/CNA). Upstream fix commit 899ee91156e5 landed in 7.1-rc7 (per Debian tracker note) — secondary blogs that call 899ee91156e5 the *introducing* commit are mistaken; the additional commits 2bec122b9fb9/3dee9d0c198f/b198ed4e5258 are stable backports. introduced=5.18 is approximate (typed-key offset logic era); confirm the exact introducing commit against your tree before relying on the lower bound. Per-distro fixed versions confirmed for Debian (Trixie 6.12.94-1, sid 7.0.13-1; Bullseye/Bookworm/Forky still vulnerable 2026-06-29); Ubuntu USN still pending (18.04-26.04 listed vulnerable 2026-06-25) — recheck the Ubuntu tracker for package versions. The compound check should flag kernel in the v5.18..v7.1-rc6 range AND act_pedit module presence/loadability. KernelCare umbrella tracking KCARE-27230.

# -----------------------------------------------------------------------------
# runc /proc/self/exe host-binary overwrite — CVE-2019-5736 (CISA KEV)
# The original, canonical runc container escape. A process running as root
# inside a container (via a malicious image on `runc run`, or an attacker with
# write access to an existing container attached via `runc exec`) reopens
# /proc/self/exe and overwrites the host runc binary, gaining host root the next
# time runc is invoked. Fixed in runc 1.0-rc7 / Docker 18.09.2. Historical but
# still a mandatory inventory item for any container-escape auditor: unpatched
# runc still appears on legacy hosts and in old base images / CI runners.
# Userspace runtime CVE -> check_type=manual (no kernel-version signal). Detection
# is a three-state model, not a version compare: host runc version if reachable
# (definitive) / userns-unmapped in-container root from check 27 (potentially
# exposed) / userns-remapped root (overwrite blocked -> hardened, downgrade INFO).
# -----------------------------------------------------------------------------
cve_id=CVE-2019-5736
name=runc /proc/self/exe Host Binary Overwrite
alias=runcescape runc-proc-self-exe
cvss=8.6
severity=CRITICAL
check_type=manual
introduced=0
fixed_versions=none
itw=yes
poc_public=yes
cisa_kev=yes
subsystem=opencontainers/runc process exec (/proc/self/exe file-descriptor mishandling)
module_names=none
mitigation=Strongest single control is user-namespace remapping: if in-container root maps to an unprivileged host UID (check /proc/self/uid_map — a first entry that does NOT map container 0 to host 0 means remapped), the container process cannot overwrite the root-owned host runc binary and this specific escape fails regardless of runc version. Additional defence-in-depth: run only trusted images; avoid `exec` into untrusted running containers; where the runtime supports it, use a read-only/dmz-protected runc (runc >= 1.1.12 self-copies via memfd). None of these substitute for upgrading runc to >= 1.0-rc7 (Docker >= 18.09.2), which is the actual fix.
socket_af=none
socket_type=none
socket_proto=none
component=runc
component_affected=<=1.0-rc6 (Docker <18.09.2)
component_fixed=1.0-rc7  # [verified vs NVD + runc advisory] Component (software) CVE — check_type=manual, NOT kernel (NVD has NO linux:linux_kernel config). NVD Configuration 2 (linuxfoundation:runc): affected up to incl 0.1.1 and 1.0.0-rc1..rc6 -> confirms <=1.0-rc6, fixed 1.0-rc7. Config 1: docker <18.09.2. Downstream (OpenShift/GKE/LXC/Mesos/DC-OS) bundle vulnerable runc — corroboration only. Data confirmed — no change.
what=CVE-2019-5736 is the original runc container escape. Because runc did not open its own executable with O_CLOEXEC, a container process running as root can open /proc/self/exe (a magic-link back to the host runc binary), then use the leaked, still-open file descriptor to overwrite the host runc binary from inside the container. The bug is triggered either by (1) a malicious image the host operator runs via `runc run`, or (2) an attacker with write access inside an existing container that is later attached with `runc exec`. Once the host runc binary is replaced with attacker code, the next container start/exec executes that code as root on the host.
impact=Full container-to-host escape yielding host root. Affects every runtime that embeds vulnerable runc (Docker, containerd, CRI-O, Kubernetes nodes, and derivatives). On multi-tenant nodes and CI/CD build farms a single malicious image or one writable container is enough to compromise the entire host and, by extension, every other workload on it.
exploit=Trivial and fully weaponised. Public PoCs and a Metasploit module exist; listed in CISA KEV as exploited in the wild. Requires only the ability to run root inside a container (the default) plus either a malicious image or `exec` access to a container. CVSS v3.x 8.6. Exploitation preconditions ARE observable from inside a container even though the runc version is not: it needs in-container root that maps to host root (no userns remapping) and a writable path to the host runc binary. Absence of those preconditions is meaningful negative evidence.
rec=Definitive fix: upgrade runc to >= 1.0-rc7 and ensure the host's Docker/containerd/CRI-O ship the patched binary (Docker >= 18.09.2); confirm with `runc --version` ON THE HOST. Because the host runc version is normally NOT readable from inside a container, this entry uses a three-state verdict instead of a version compare: (a) VERIFY-ON-HOST — if the host runc version is obtainable (e.g. a mounted runtime socket via check 31, or host-side inspection), compare it directly; (b) POTENTIALLY EXPOSED — if check 27 shows in-container root with NO userns remapping (/proc/self/uid_map maps 0 -> 0), the escape precondition is present, so flag and tell the operator to verify host runc; (c) HARDENED AGAINST THIS CLASS — if userns remapping is active (in-container root maps to an unprivileged host UID), the binary-overwrite fails regardless of runc version, so downgrade to INFO. The uid_map / remapping signal is already gathered by check 27; check 26 (runc masked-path) surfaces any runc version string that is reachable. Treat "no signal" as UNKNOWN, never as SAFE.
notes=check_type=manual userspace runtime CVE. component_fixed records the runc package fix; fixed_versions=none refers to the (n/a) kernel. Detection is a three-state model (see rec), NOT a version compare, because the host runc version is usually invisible from inside a container. Positive host-version evidence -> definitive; userns-unmapped in-container root (check 27) -> potentially exposed, verify host; userns-remapped root -> hardened against this specific overwrite (downgrade to INFO). The remapping check is the one genuinely useful in-container signal for this CVE and is shared with check 27; do not report a clean userns state as "patched" — it means the overwrite path is blocked, not that runc is fixed.

# -----------------------------------------------------------------------------
# runc process.cwd / leaked-fd container breakout — CVE-2024-21626 (Leaky Vessels)
# runc 1.1.11 and earlier leak an internal file descriptor, letting a newly
# spawned container process end up with a working directory in the HOST
# filesystem namespace. Reachable via a malicious image on `runc run`/`docker
# build` (incl. indirectly through FROM/ONBUILD), or from inside a container via
# `runc exec`. Variants can overwrite semi-arbitrary host binaries for a full
# escape. Fixed in runc 1.1.12. Part of the "Leaky Vessels" set alongside the
# BuildKit CVEs 2024-23651/23652/23653 (out of scope here — BuildKit, not runc).
# Userspace runtime CVE -> check_type=manual. Distinctive in-container signal: a
# /proc/*/cwd escape probe (runc 1.1.12's fix is a cwd-inside-container check), so
# a cwd resolving onto the host fs indicates an in-progress attack-2/3 breakout.
# eBPF (Snyk) is higher fidelity; the cwd probe detects exploitation, not latency.
# -----------------------------------------------------------------------------
cve_id=CVE-2024-21626
name=runc process.cwd Leaked-FD Container Breakout
alias=leaky-vessels leakyvessels GHSA-xr7r-f8xq-vfvv
cvss=8.6
severity=CRITICAL
check_type=manual
introduced=0
fixed_versions=none
itw=no
poc_public=yes
cisa_kev=no
subsystem=opencontainers/runc process.cwd handling (internal file-descriptor leak)
module_names=none
mitigation=Upgrade runc to >= 1.1.12 and update anything that bundles runc (Docker, containerd, CRI-O, managed-Kubernetes node images per vendor advisories). Interim/defence-in-depth: only build/run trusted images and treat FROM/ONBUILD base images as untrusted input; disabling unprivileged user namespaces (kernel.unprivileged_userns_clone=0 on Debian/Ubuntu, user.max_user_namespaces=0 on RHEL) shrinks the surrounding escalation surface though it does not fix the fd leak itself. Follow cloud-provider node-patch advisories for managed clusters.
socket_af=none
socket_type=none
socket_proto=none
component=runc
component_affected=<=1.1.11
component_fixed=1.1.12  # [verified vs NVD + runc advisory] Component (software) CVE — check_type=manual, NOT kernel (NVD has NO linux:linux_kernel config). NVD Configuration 1 (linuxfoundation:runc): affected up to excluding 1.1.12 -> confirms <=1.1.11 affected, fixed 1.1.12. Config 2: Fedora 39 (bundled, corroboration). Leaky Vessels sibling CVEs (2024-23651/23652/23653) are BuildKit, intentionally out of scope. Data confirmed — no change.
what=CVE-2024-21626 (Leaky Vessels) is an order-of-operations container breakout in runc <= 1.1.11. An internal file-descriptor leak lets a newly spawned container process inherit a working directory (process.cwd) that resolves into the host filesystem namespace. A malicious image can trigger this on `runc run` / `docker build` (including indirectly via FROM or ONBUILD), and an attacker inside a container can trigger it via `runc exec` ("attack 2"). Because runc did not verify that the final working directory was inside the container mount namespace after chdir, the container process gains access to the host filesystem; variants ("attack 3a"/"3b") adapt this to overwrite semi-arbitrary host binaries via /proc/self/fd/N/../.. path traversal for a complete escape.
impact=Container-to-host escape giving read/write access to the host filesystem and, in the binary-overwrite variants, full host compromise. In Docker/Kubernetes contexts it is effectively critical: anyone able to start a container image, or to get a malicious image built (supply-chain / compromised base image), can reach the node. Multi-tenant nodes, shared build farms, and registries pulling untrusted layers are the high-risk cases.
exploit=Public PoCs and demos exist for both the malicious-image and docker-build vectors; no in-the-wild KEV listing. Attack 1 / 3a need a privileged user tricked into running a malicious image (UI:R), while attacks 2 / 3b break out from inside a container with only ordinary `exec` access. All four lead to host takeover. CVSS 8.6 (NVD); per-attack scores range roughly 7.2-8.2. Unlike most runc bugs this one leaves a distinctive OBSERVABLE artefact: a successfully-exploited process has a working directory outside the container mount namespace, so its /proc/<pid>/cwd symlink resolves onto the host filesystem. runc's own 1.1.12 fix is precisely a guard that cwd is inside the container root.
rec=Definitive fix: upgrade runc to >= 1.1.12 and rebuild/repull any images and higher-level runtimes that bundle it; apply managed-Kubernetes node updates per your provider; verify host `runc --version`. Because the host runc version is normally NOT readable from inside a container, this entry uses a three-state verdict: (a) VERIFY-ON-HOST — compare directly if the host runc version is reachable (mounted runtime socket via check 31, or host-side inspection); (b) POTENTIALLY EXPOSED / ACTIVE-COMPROMISE SIGNAL — a read-only cwd-escape probe: walk /proc/*/cwd (and check the auditor's own cwd) and flag any whose target escapes the container root (e.g. resolves to a path/device or st_dev/inode inconsistent with "/" of the container rootfs, or contains /proc/self/fd/ traversal). A cwd pointing outside the container root is strong evidence of an in-progress or successful attack-2/3 breakout; c) LOW-SIGNAL — no escaped cwd observed. Note (c) does NOT clear the CVE: it only means no exploitation is currently visible; the fd leak can still be triggered by a fresh malicious image/exec. Snyk's eBPF leaky-vessels-runtime-detector is the higher-fidelity live detector and static Dockerfile analysers (WORKDIR/ONBUILD inspection) catch malicious images pre-run. check 26 surfaces any reachable runc version string. Treat "no signal" as UNKNOWN, never SAFE.
notes=check_type=manual userspace runtime CVE. component_fixed records the runc package fix; fixed_versions=none refers to the (n/a) kernel. Detection is a three-state model (see rec), NOT a version compare. The one genuinely useful in-container signal specific to this CVE is a /proc/*/cwd escape probe: runc 1.1.12's fix is a cwd-inside-container-root check, so a cwd resolving onto the host filesystem is a high-value behavioural indicator of attack 2/3. That probe detects exploitation-in-progress, not latent vulnerability — a negative result means "no active breakout seen", not "patched". Scope note: the sibling "Leaky Vessels" CVEs (CVE-2024-23651/23652/23653) are BuildKit/Docker, not runc, and are intentionally NOT added here — they belong to image-build tooling outside this auditor's in-container runtime scope. If a dedicated script check is added for the cwd probe, name it here and in rec so the manual-entry contract (live detection handled by a named check) is satisfied.

