fixed_versions=5.10:5.10.256 5.15:5.15.207 6.1:6.1.173 6.6:6.6.139 6.12:6.12.89 6.18:6.18.31 7.0:7.0.8 mainline:7.1-rc4  # upstream stable releases per LWN; fix commit 31e62c2ebbfd. RHSB-2026-004 (RHEL), AlmaLinux 8/9/10 patched, Ubuntu USN shipped. Confirm exact distro package builds against vendor tracker
