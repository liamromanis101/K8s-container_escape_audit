# -----------------------------------------------------------------------------
# IPv6 fragmentation container escape — CVE-2026-53362
# Miscalculation in the kernel's paged IPv6 transmit path (centered on
# __ip6_append_data()) causes an out-of-bounds write into skb_shared_info,
# chainable into arbitrary kernel read/write, credential overwrite, and
# container escape. Fixed across the 2026-07-04 stable kernel batch.
# Exploitation requires the ability to create network namespaces, which
# default RHEL 10-style configurations grant to unprivileged users via user
# namespaces. LIKELY the same bug Red Hat (RHSB-2026-009) and Finland's
# NCSC (Traficom) tracked pre-CVE-assignment as "ipv6_frag_escape" / a
# Linux 6.12 vulnerability with a public PoC targeting CentOS/RHEL 10-style
# kernels — the mechanism (__ip6_append_data OOB write) and timeline match,
# but this correlation is NOT independently confirmed against an authoritative
# source tying the two identifiers together. Treat as the same issue for
# patch-priority purposes but do not merge/delete either record until
# confirmed. This is distinct from the "Dirty Frag" ESP/RxRPC chain above.
# -----------------------------------------------------------------------------
