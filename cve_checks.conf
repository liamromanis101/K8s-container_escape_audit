component=containerd
component_affected=1.7.x<1.7.33, 2.0.x<2.0.10, 2.1.x<2.1.9, 2.2.x<2.2.5, 2.3.x<2.3.2 (CRI plugin, 1.7 through 2.3)
component_fixed=1.7.33  # [verified vs oss-sec seclists.org/oss-sec/2026/q2/970 + GHSA-cvxm-645q-p574 + AWS bulletin 2026-046] Component (software) CVE — check_type=manual, NOT kernel. Multi-branch fix: 2.3.2 / 2.2.5 / 2.1.9 / 2.0.10 / 1.7.33. component_fixed anchors the 1.7 LTS line for display; check 52's CONTAINERD_CRI_VERDICT does the branch-aware compare. Per DailyCVE, CVE-2026-50195 affected 2.1.0-2.1.8 / 2.2.0-2.2.4 / 2.3.0-2.3.1 (plus the 1.7 line per AWS) — CONFIRM the exact 1.7.x lower bound against the GHSA if a precise 1.7 range is required.
what=CVE-2026-50195 is a missing-validation flaw in containerd's CRI checkpoint import path. containerd does not validate the image references specified inside a checkpoint image's configuration. An attacker with permission to create pods supplies a crafted checkpoint whose io.containerd.cri.image-ref annotation points to an attacker-controlled image; on import containerd pulls that image and assigns it an arbitrary local tag, poisoning the node's local image cache so a legitimate tag now resolves to the attacker's image.
impact=Cross-pod code execution on a shared Kubernetes node. Any other pod on the same node that later uses the poisoned tag with an IfNotPresent or Never pull policy silently runs the attacker's image and executes code under the victim pod's identity — a lateral-movement / privilege-escalation primitive across tenants on a node, and a stepping stone to node/host compromise when chained with an in-container escape. containerd underpins EKS, ECS, Fargate, Bottlerocket and Amazon Linux, so managed platforms are in scope until their node runtimes are patched.
exploit=Preconditions: checkpoint/restore enabled on the node (CRIU installed) and the attacker holding pod-create permission (or equivalent CRI access). Given those, the mechanism is a straightforward crafted checkpoint tar with a poisoned image-ref annotation, imported via the CRI API or ctr — no memory-corruption or race. CVSS 8.8.
rec=1) Upgrade containerd to >= 2.3.2, 2.2.5, 2.1.9, 2.0.10, or 1.7.33 (apply your managed provider's patched node image where applicable — AWS is rolling patched runtimes to EKS/ECS/Fargate/Bottlerocket). 2) If checkpoint/restore is not needed, do not install CRIU / disable the feature — this removes this CVE's attack surface. 3) Tighten RBAC so untrusted principals cannot create pods or import checkpoints. 4) Admit only trusted images and registries; prefer digest-pinned images and Always pull policies for sensitive workloads to defeat local-tag poisoning. 5) check 52 (check_runtime_versions) probes the reachable containerd version and now cross-references this CVE — a version below the branch fix is reported as a definitive verdict.
notes=check_type=manual userspace runtime CVE. component_fixed records the containerd package fix; fixed_versions=none refers to the (n/a) kernel. Live detection is check 52's containerd version probe (CONTAINERD_CRI_VERDICT), which keys the whole 2026-06 CRI cluster (CVE-2026-50195/53488/53492/53489/47262) off the reachable binary's release branch. Disclosed 2026-06-18 (AWS bulletin 2026-046 / oss-sec). Independently found by Jakub Ciolek (AlphaSense) and Kyle Elliott (Trail of Bits).

