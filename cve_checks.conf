alias=containerd-uid-bypass GHSA-fqw6-gf59-qr4w CVE-2024-40635
cvss=7.3
severity=HIGH
check_type=manual
introduced=0
fixed_versions=none
itw=no
poc_public=no
cisa_kev=no
subsystem=containerd user-id handling
module_names=none
mitigation=Upgrade containerd to >= 1.7.32 / 2.0.9 / 2.2.4 / 2.3.1; enforce a numeric runAsUser in the Pod securityContext; use Kubernetes >= 1.34; only run trusted images
socket_af=none
socket_type=none
socket_proto=none
component=containerd
component_affected=<1.7.32 (and 2.0.x<2.0.9, 2.2.x<2.2.4, 2.3.x<2.3.1; 2.1.x EOL)
component_fixed=1.7.32  # [verified vs containerd GHSA] Component (software) CVE — check_type=manual, NOT kernel. NO NVD entry for CVE-2026-46680; authoritative source is the containerd security advisory (multi-branch fix: 1.7.32 / 2.0.9 / 2.2.4 / 2.3.1; 2.1.x EOL). Data confirmed correct — no change needed.
what=CVE-2026-46680 is an input-validation bug in containerd. When a container is launched with a numeric User directive that cannot be parsed as a 32-bit integer (e.g. a value larger than 2147483647), containerd incorrectly treats the numeric string as a username and resolves it against the container image's /etc/passwd. A crafted image that maps that large numeric string to root (UID 0) causes the container to ultimately run as root. The closely related earlier advisory is CVE-2024-40635 (same class, UID overflow / wraparound).
impact=Complete bypass of the Kubernetes runAsNonRoot security control: a workload that is supposed to be forced non-root runs as UID 0 instead. Combined with any other in-container-root escalation path this becomes a force multiplier toward container escape and host compromise. Requires the ability to run a crafted/untrusted image (or a malicious image author).
exploit=No public exploit code; the mechanism is straightforward (image USER set to e.g. 4294967296 plus a matching /etc/passwd entry mapping it to root). Moderate severity; gated on running untrusted images and on the cluster relying on runAsNonRoot rather than an explicit numeric runAsUser.
rec=1) Upgrade containerd to >= 1.7.32, 2.0.9, 2.2.4, or 2.3.1 (containerd 2.1.x is end-of-life with no fix — migrate off it). 2) Enforce a specific numeric runAsUser in the Pod securityContext, which overrides the image USER directive and prevents the bypass. 3) Kubernetes >= 1.34 enforces runAsNonRoot correctly regardless of this bug. 4) Admit only trusted images; use OPA/Kyverno to reject UID values >= 2147483647. 5) check_user_namespace_mapping (check 27) flags running as UID 0 without userns remapping, the observable end-state of this bypass.
notes=check_type=manual userspace runtime CVE. component_fixed records the containerd package fix; fixed_versions=none refers to the (n/a) kernel. The numeric finding ID will derive from the subsystem slug.

