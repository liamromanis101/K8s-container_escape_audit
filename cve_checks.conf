what=GhostLock (CVE-2026-43499) is a use-after-free in the Linux kernel's futex priority-inheritance handling, present in shipping kernel configurations for roughly 15 years. It requires no special permission, unusual configuration, or network access — ordinary threading/synchronisation calls from any local, unprivileged program are sufficient to trigger it.
impact=Full local privilege escalation to root, and the researchers' exploit also escapes containers. Because the triggering conditions are routine local-process behaviour, essentially any host that runs untrusted or semi-trusted local code — shared machines, CI runners, containers, multi-tenant servers — is exposed until patched. No known in-the-wild exploitation as of disclosure, but working exploit code is public.
exploit=High. Nebula Security's exploit is reported 97% reliable in testing and demonstrated as part of a documented kernelCTF submission. No special capability is required to trigger — the vulnerability class is comparable in accessibility to 2016's Dirty Cow. It is paired in Nebula's IonStack writeup with a Firefox renderer sandbox-escape (CVE-2026-10702) that reaches this bug from inside the browser, though that first-stage bug is out of this database's kernel-only scope.
rec=1) Install your distribution's CURRENT kernel build, not merely the first one labelled as containing a fix — the original upstream patch introduced a separate crash bug (CVE-2026-53166) that was still being cleaned up upstream in early July 2026. 2) Explicitly confirm your distro's advisory and package version rather than assuming a fix is available; availability was uneven across LTS lines at disclosure. 3) There is no complete interim workaround; RANDOMIZE_KSTACK_OFFSET and STATIC_USERMODE_HELPER build options raise the bar but do not close the hole. 4) Prioritise shared/multi-tenant machines, cloud servers, containers, and CI runners — the environments where an attacker is most likely to obtain the local foothold this bug needs.
notes=Companion regression: CVE-2026-53166 was introduced by the first fix attempt for GhostLock and was still being finalised upstream as of early July 2026 — track both CVE ids and confirm the FINAL fix, not the first one, is present. introduced, fixed_versions, and upstream_ranges are marked VERIFY/0 pending confirmed commit hashes and NVD publication; do not rely on kernel_version alone for a clean bill of health until these are filled in — treat "no signal" as UNKNOWN, not SAFE, consistent with this file's convention for other manual/uncertain entries.

