what=DirtyClone (CVE-2026-43503) is the fourth member of the DirtyFrag vulnerability family, disclosed by JFrog Security Research on 2026-06-25 after being found during an audit of the earlier DirtyFrag fixes. The core flaw is in __pskb_copy_fclone() (with skb_shift() also affected), which drops the SKBFL_SHARED_FRAG safety flag during internal packet cloning — the same flag the original DirtyFrag mitigation introduced to mark file-backed page-cache memory shared into an skb. With the marker lost, an attacker-controlled cloned packet routed through an IPsec/XFRM tunnel undergoes in-place decryption that writes attacker-chosen bytes into the page cache of a privileged binary. The underlying issue is a contract problem: every skb frag-transfer helper must preserve the shared-frag bit, and several did not. Mainline fix commit 48f6a5356a33 propagates SKBFL_SHARED_FRAG across all skb copy/clone, coalesce, GRO-receive, and segment paths.
impact=Any unprivileged local user gains root by overwriting a setuid-root binary (e.g. /usr/bin/su) in the page cache. The on-disk file is unchanged, so on-disk integrity monitoring does not detect the tampering and no kernel log or audit trace is produced. Because the page cache is shared host-wide, this is also a container-escape / node-compromise vector on multi-tenant cloud, Kubernetes, and CI-runner hosts. Critically, kernels patched for the original DirtyFrag CVEs (CVE-2026-43284/-43500) but lacking the Fragnesia and DirtyClone follow-up fixes remain exploitable — full protection requires the entire patch series.
exploit=High. CVSS 8.8. JFrog published a working exploit walkthrough on 2026-06-25 (first public demonstration of this variant; full exploit code withheld pending distribution patch rollout). Deterministic page-cache write, no race-win retries. Requires CAP_NET_ADMIN — obtainable by any unprivileged user via 'unshare -Urn' on default Debian/Fedora. Ubuntu 24.04+ raises the bar with AppArmor namespace confinement but does not fully close the window; the underlying kernel flaw remains present.
rec=1) Apply the distribution kernel update (mainline fix commit 48f6a5356a33, first fixed tag v7.1-rc5) and REBOOT — verify with 'uname -r' that the patched kernel is actually running and that containers/CI/VM hosts use the updated host kernel. Ubuntu minimum patched: 7.0.0-22.22 (26.04), 6.17.0-35.35 (25.10), 6.8.0-124.124 (24.04), 5.15.0-181.191 (22.04); Debian: Bullseye 5.10.257-1, Bookworm 6.1.174-1, Trixie 6.12.94-1. 2) Interim: blacklist the in-place decryption modules and drop caches — see the compensating-control command appended below (from this entry's mitigation field). WARNING: breaks IPsec/VPN and AFS where used. 3) As defence-in-depth, cut the CAP_NET_ADMIN acquisition path: 'sysctl -w kernel.unprivileged_userns_clone=0' (Debian/Ubuntu) or 'user.max_user_namespaces=0' (RHEL). 4) Do not rely on file-integrity tooling to detect compromise — the on-disk binary stays clean.
notes=Ubuntu tracks this CVE under the name "Fragnesia". IMPORTANT: CVE-2026-43503 is the SECOND of the two Fragnesia commits — the kernel CNA assigned 43503 to commit 48f6a5356a33 while CVE-2026-46300 covers the first (f84eca581739). They are one remediation split across two CVEs and ship together (e.g. Debian DSA-6295-1 lists both); treat 46300 and 43503 as a pair, not independent issues. DirtyClone, DirtyFrag, and Fragnesia are siblings sharing one primitive (file-backed page cache treated as writable skb frags), not a sequential chain. The compound check should flag any kernel before the per-series fix AND presence/loadability of the esp4/esp6/rxrpc in-place-decryption modules; the primary vulnerable code (__pskb_copy_fclone, skb_shift) is in core skbuff and is not module-gated, so kernel version is the authoritative signal. Debian fixed versions confirmed via security-tracker.debian.org 2026-06-29 (Bullseye 5.10.257-1, Bookworm 6.1.174-1, Trixie 6.12.90-1, sid 7.0.9-1); Ubuntu versions from Ubuntu tracker. Cross-ref: CVE-2026-46300 (paired), CVE-2026-43284/-43500 (Dirty Frag family).

 


