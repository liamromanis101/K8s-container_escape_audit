module_names=rds rds_tcp
mitigation=If RDS is not in use (it rarely is outside Oracle RAC/InfiniBand HPC clusters), blacklist the modules: printf 'install rds /bin/false\ninstall rds_tcp /bin/false\n' > /etc/modprobe.d/pintheft.conf && rmmod rds_tcp rds 2>/dev/null. On kernels 6.6+ also gate the second half of the chain by disabling io_uring with sysctl kernel.io_uring_disabled=2. Either control alone breaks the exploit; many distros (e.g. Ubuntu) already blacklist RDS by default via /etc/modprobe.d/blacklist-rare-network.conf.
socket_af=none
socket_type=none
socket_proto=none
what=A reference-count flaw in the Linux kernel RDS (Reliable Datagram Sockets) zerocopy send path. When rds_message_zcopy_from_user() pins user pages and a later page faults, the error path drops pages it already pinned while op_nents is not reset, so subsequent RDS message cleanup drops the same references again. Each failed zerocopy send steals one pin reference from the first page. The public exploit chains this with io_uring fixed buffers (REGISTER_BUFFERS): after the pin references are drained, io_uring still believes it holds a valid page, but that physical page can be freed and reused by the page cache, yielding a controlled overwrite of the in-memory page cache of a SUID-root binary. Same end primitive as Copy Fail (CVE-2026-31431) but reached through a different subsystem. The underlying RDS bug dates to kernel 4.17 (2018); the working PoC additionally depends on io_uring features present in roughly 6.6+.
impact=Any unprivileged local user on an affected host gains root by overwriting a setuid binary in the page cache. The on-disk file is unchanged, so on-disk integrity checks miss it. The page cache is shared across the host, so on multi-tenant nodes, CI runners, and container hosts this is also a container-escape / node-compromise vector. Two independent prerequisites must both hold: the rds/rds_tcp modules must be loadable AND io_uring must be reachable.
exploit=Reliable and deterministic. A public PoC and technical write-up (V12 Security / Aaron Esau) are available; no race-win retries needed once both prerequisites are met. Requires only an unprivileged local shell. Mitigated by default on distributions that blacklist RDS or disable io_uring, which is why default Ubuntu/CloudLinux configs are reported safe.
rec=Apply the distribution kernel update that backports the upstream RDS zerocopy fix (candidate posted to netdev 2026-05-05). Confirm the fixed package version against your distribution's security tracker before relying on a patched verdict, as backports vary by vendor. Live detection is supported by the dangerous-modules audit (check 47, rds/rds_tcp) and the io_uring reachability probe (check 48); a finding is most actionable when both gates are present.
notes=Also tracked as QVD-2026-27616. Two-gate CVE: cross-reference check 47 (rds/rds_tcp module presence) with check 48 (io_uring reachability). If either gate is closed (RDS blacklisted, or kernel.io_uring_disabled=2), the documented exploit chain does not apply on that host.

# -----------------------------------------------------------------------------
# pedit COW — net/sched act_pedit partial-COW page-cache corruption, LPE
# CVE assigned 2026-06-16 (Linux kernel CNA); public PoC "packet_edit_meme"
# on GitHub within 24h. tcf_pedit_act() computes the COW range once before the
# key loop via tcfp_off_max_hint, missing the runtime header offset added by
# typed keys -> partial COW -> write lands in shared page cache. Same local-to-
# root page-cache-poisoning class as Copy Fail / DirtyFrag / DirtyClone, but a
# distinct entry point (tc act_pedit, not skb/XFRM). Bug introduced by commit
# 899ee91156e5; present v5.18 through v7.1-rc6; fixed v7.1-rc7. Reachable by
# unprivileged users via namespace-local CAP_NET_ADMIN (unprivileged userns).
# Red Hat rates Important (RHSB-2026-008). Compound check: kernel version range
# AND act_pedit module presence/loadability.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-46331
name=pedit COW
alias=pedit-cow packet_edit_meme act_pedit-cow
cvss=8.5  # CVSS v4.0 base 8.5 HIGH (Ubuntu/CNA) AV:L/AC:L/AT:N/PR:L/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N; Red Hat severity Important
severity=HIGH
check_type=compound
introduced=5.18
fixed_versions=trixie:6.12.94-1 sid:7.0.13-1 mainline:7.1-rc7  # Debian DSA-6355-1: Trixie fixed 6.12.94-1, unstable 7.0.13-1; Bullseye/Bookworm/Forky still vulnerable as of 2026-06-29. RHEL RHSA-2026:27288 (10)/27789 (9)/27353 (8). Ubuntu 18.04-26.04 vulnerable as of 2026-06-25 (USN pending). Upstream fix commit 899ee91156e5 in 7.1-rc7
itw=no
poc_public=yes
cisa_kev=no
subsystem=net/sched/act_pedit
module_names=act_pedit
mitigation=echo 'install act_pedit /bin/true' > /etc/modprobe.d/disable-act_pedit.conf; rmmod act_pedit 2>/dev/null
socket_af=none
socket_type=none
socket_proto=none
what=CVE-2026-46331 (pedit COW) is a partial copy-on-write page-cache corruption flaw in the Linux kernel net/sched traffic-control subsystem, in the act_pedit action used by tc to rewrite packet header bytes in flight. tcf_pedit_act() calls skb_ensure_writable() a single time before the key loop, deriving the writable range from tcfp_off_max_hint — a static hint that omits the runtime header offset added when a typed key resolves its target at execution time. Writes inside the loop can therefore land outside the COW'd region, mutating bytes in a page still shared with the page cache. The upstream fix moves skb_ensure_writable() inside the per-key loop, adds overflow checking on the offset arithmetic, uses skb_cow() for negative (e.g. ingress Ethernet) offsets, and guards offset_valid() against INT_MIN. Introduced by commit 899ee91156e5; fix commits 899ee91156e5 2bec122b9fb9 3dee9d0c198f b198ed4e5258.
impact=Any unprivileged local user gains a root shell on affected systems where the act_pedit action is reachable. The public PoC poisons the page-cached image of setuid-root /bin/su (overwriting its ELF entry point with setgid(0)+setuid(0)+execve("/bin/sh") shellcode) and walks straight to root. As with the other page-cache-poisoning bugs, the on-disk binary is unchanged so file-integrity tooling does not detect tampering, and the shared page cache makes this a container-escape / node-compromise vector on multi-tenant hosts, Kubernetes nodes, and CI/CD runners.
exploit=High in practice despite the bug surfacing as a "routine data-corruption" netdev patch with no security framing. A public, author-verified PoC ("packet_edit_meme") appeared on GitHub within 24 hours of CVE assignment on 2026-06-16. Exploitation needs CAP_NET_ADMIN to configure the tc pedit rule — but this is reachable by unprivileged users via namespace-local CAP_NET_ADMIN where unprivileged user namespaces are enabled (default on Debian/Ubuntu). Deterministic page-cache write, no race. This is an N-day: exploitable detail was on a public mailing list before most teams had a CVE, advisory, or patch.
rec=1) Install the patched distribution kernel and REBOOT (upstream fixed in v7.1-rc7; verify against your vendor advisory: RHEL RHSA-2026:27288 (10) / 27789 (9) / 27353 (8), Debian DSA-6355-1 for Trixie). Confirm with 'uname -r' and ensure container/CI/VM hosts run the updated host kernel. 2) Interim: act_pedit auto-loads the moment a pedit tc action is referenced, so a plain blacklist is insufficient — use an install override: 'echo install act_pedit /bin/true > /etc/modprobe.d/disable-act_pedit.conf' (plus 'rmmod act_pedit' if currently loaded). Most hosts run no tc pedit rules and can disable it safely. 3) Defence-in-depth: disable unprivileged user namespaces ('kernel.unprivileged_userns_clone=0' on Debian/Ubuntu, 'user.max_user_namespaces=0' on RHEL) to remove the namespace-local CAP_NET_ADMIN path — breaks rootless containers and browser sandboxes. 4) Treat any host suspected of running the exploit as fully compromised regardless of file-integrity results.
notes=Same page-cache-poisoning outcome as Copy Fail (CVE-2026-31431) and the DirtyFrag family, but a separate subsystem (tc act_pedit) and separate module gate (act_pedit), so it warrants its own entry rather than coverage by the esp4/esp6/rxrpc blacklist. CVSS confirmed as CVSS v4.0 base 8.5 (Ubuntu/CNA). Upstream fix commit 899ee91156e5 landed in 7.1-rc7 (per Debian tracker note) — secondary blogs that call 899ee91156e5 the *introducing* commit are mistaken; the additional commits 2bec122b9fb9/3dee9d0c198f/b198ed4e5258 are stable backports. introduced=5.18 is approximate (typed-key offset logic era); confirm the exact introducing commit against your tree before relying on the lower bound. Per-distro fixed versions confirmed for Debian (Trixie 6.12.94-1, sid 7.0.13-1; Bullseye/Bookworm/Forky still vulnerable 2026-06-29); Ubuntu USN still pending (18.04-26.04 listed vulnerable 2026-06-25) — recheck the Ubuntu tracker for package versions. The compound check should flag kernel in the v5.18..v7.1-rc6 range AND act_pedit module presence/loadability. KernelCare umbrella tracking KCARE-27230.


