mitigation=No module to blacklist — this is core network-stack code. Interim: restrict the ability to create network namespaces, e.g. disable unprivileged user namespaces (kernel.unprivileged_userns_clone=0 on Debian/Ubuntu; user.max_user_namespaces=0 on RHEL). This does not patch the bug but removes the primary access path documented by Red Hat for unprivileged exploitation.
socket_af=10
socket_type=2
socket_proto=17
what=CVE-2026-53362 is a bounds-check failure in the Linux kernel's IPv6 output path, in the function that assembles outgoing IPv6 fragments (__ip6_append_data()). Under a vulnerable configuration, building fragmented IPv6 traffic via a UDP socket using MSG_SPLICE_PAGES can undersize an internal allocation, causing the kernel to write past the end of the socket buffer head into adjacent skb_shared_info. This can be chained into a broader kernel read/write primitive.
impact=Chainable into credential overwrite, security-module (e.g. SELinux) bypass, and full container-to-host escape to root. A user with local access inside a container — meeting the network-namespace-creation prerequisite — can escape to the host. Red Hat notes any product built on an affected RHEL kernel, including RHEL CoreOS, is potentially impacted, which extends this to managed Kubernetes nodes built on affected base images.
exploit=Exploitation requires the ability to create network namespaces; this is granted to unprivileged users by default on RHEL 10-style configurations via user namespaces. A public PoC targeting CentOS Stream 10 / RHEL 10-style 6.12 kernels exists and documents additional prerequisites (five-level paging, world-readable BTF data, CONFIG_INIT_ON_ALLOC_DEFAULT_ON disabled) that limit copy-paste reliability without eliminating the underlying risk on systems that meet them.
rec=1) Patch to a kernel containing the fix from the 2026-07-04 stable batch or your distribution's backport (AlmaLinux 10 has published a testing kernel: kernel-6.12.0-211.28.2.el10_2). 2) Interim: restrict unprivileged user-namespace creation to reduce the exploitation surface (see mitigation) — evaluate impact on workloads that rely on rootless containers first. 3) Treat CI runners, shared developer systems, and multi-tenant container/Kubernetes hosts running an affected kernel lineage as priority patch targets even before a CVSS score is published.
notes=Alias/identity correlation with the pre-CVE "ipv6_frag_escape" advisories (RHSB-2026-009, Traficom NCSC-FI 2026-07-02) is treated as likely but UNCONFIRMED — same mechanism and timeline, but no source in this pass explicitly maps the informal name to CVE-2026-53362. Do not deduplicate against a future formally-named entry without checking. fixed_versions list needs confirmation to rule in/out the 5.10/5.15 series given introduced=6.0.

# -----------------------------------------------------------------------------
# Bad Epoll — CVE-2026-46242, epoll ep_remove() race-condition UAF
# Disclosed 2026-07-03 by Jaeyoung Chung (Seoul National University),
# reported as a kernelCTF zero-day. Two threads can both attempt to clean
# up the same struct eventpoll/file object; one frees memory the other is
# still using. ~6-instruction race window; public PoC reports 99%
# reliability on a 6.12 kernel. Introduced by commit 58c9b016e128
# (2023-04-08, ~v6.4); fixed by commit a6dc643c6931, merged 2026-04-24 —
# fix predates public disclosure by ~10 weeks. Kernels based on v6.1 and
# earlier are NOT affected (bug did not exist yet). Notable: this is the
# sibling of CVE-2026-43074, an earlier race in the same ~2500-line epoll
# code path that Anthropic's Mythos model reportedly found and which was
# already fixed; Mythos did not find this one. No module to blacklist —
# epoll is not optional kernel infrastructure. Also reachable from within
# Chrome's renderer sandbox and roots Android devices on kernel v6.6+
# (e.g. Pixel 10); Android root exploit was still in progress as of
# disclosure.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-46242
name=Bad Epoll
alias=bad-epoll
cvss=VERIFY  # [NEEDS CONFIRMATION] no NVD/vendor CVSS score captured from public sources at time of writing
severity=CRITICAL
check_type=kernel_version
introduced=6.4  # commit 58c9b016e128, 2023-04-08; kernels based on v6.1 and earlier confirmed NOT affected per researcher writeup
fixed_versions=none  # VERIFY — fix commit a6dc643c6931 merged mainline 2026-04-24; per-series stable/distro backport versions not confirmed from public sources as of this pass. Do not assume "not on official CVE watchlists" means unpatched — check package changelog for the commit, not just uname -r.
upstream_ranges=introduced|6.4  # [NVD-ABSENT] No NVD CPE configuration published for CVE-2026-46242 as of this pass. Encode introduced floor only; add fixed/range tokens once per-series backport versions are confirmed.
vendor_defer=VERIFY
itw=no
poc_public=yes
cisa_kev=no
subsystem=fs/eventpoll (epoll ep_remove() cleanup path)
module_names=none
mitigation=none  # epoll is core kernel infrastructure with no module to unload and no runtime toggle; patching is the only remediation
socket_af=none
socket_type=none
socket_proto=none
kallsyms_sym=ep_remove  # supporting signal only — presence of the symbol does not indicate vulnerability, but its absence/rename could indicate a non-stock kernel worth investigating separately
what=Bad Epoll (CVE-2026-46242) is a race-condition use-after-free in the Linux kernel's epoll subsystem, in the ep_remove() cleanup path. One code path can clear an epoll-to-file link and continue using it while a concurrent release of the same underlying file, observing the cleared link, frees the backing object out from under it. Winning the ~6-instruction race lets an unprivileged local process turn an 8-byte UAF write into control of a struct file via a cross-cache attack, then escalate to arbitrary kernel read/write and full root.
impact=Full local privilege escalation to root on any affected Linux kernel; also roots Android devices on kernel v6.6+ (relevant hardware: Pixel 10-class devices). Because epoll underpins essentially every high-performance network service (nginx, most language runtimes' event loops, browsers), the reachable surface is very broad. Also directly relevant to shared hosting, CI runners, and container/Kubernetes nodes running workloads of mixed trust — any local code execution on an affected host is a path to root.
exploit=High. Public PoC (kernelCTF submission, github.com/J-jaeyoung/bad-epoll) reports 99% reliability on a 6.12 kernel (same base as AlmaLinux 10). No special capabilities required — any unprivileged local user can attempt it. Also reachable from inside Chrome's renderer sandbox, which blocks most other kernel LPE bugs. Not on CISA KEV and no confirmed in-the-wild exploitation as of disclosure, but the exploit is public and reliable enough that this should be treated as high-urgency patching rather than low-priority.
rec=1) Patch to a kernel containing commit a6dc643c6931 or your distribution's confirmed backport — verify via package changelog, not uname -r alone, and confirm the host has actually rebooted into the new kernel. 2) There is no configuration-level workaround; epoll cannot be disabled. 3) As defence-in-depth only (does not fix the bug): ensure KASLR and SLUB/SLAB randomization are enabled to raise exploit difficulty. 4) Prioritise multi-tenant hosts, CI runners, and any system where untrusted or semi-trusted local code executes, plus Android fleets on kernel v6.6+ once a public root exploit lands.
notes=Sibling bug to CVE-2026-43074 (an earlier race in the same epoll code path, reportedly found by Anthropic's Mythos model and already fixed with lower urgency) — intentionally not added as a separate full entry in this pass; see Section 5 header. The race leaves little runtime evidence (does not reliably trigger KASAN after CVE-2026-43074 was patched), so absence of crash/oops signatures should not be read as absence of exploitation attempts. cvss, fixed_versions, and vendor_defer are VERIFY pending confirmation.

