# CVE-2026-46333 — ptrace credential-hijack LPE (Qualys TRU)
# Disclosed 2026-05-20. Public exploits circulating. Patch committed 2026-05-14.
# Vulnerable code in mainline since v4.10-rc1 (Nov 2016), BUT the public exploit
# path is gated by pidfd_getfd() (added v5.6-rc1, Jan 2020) — so 5.6 is the
# realistic exploitable floor. Mitigation: kernel.yama.ptrace_scope=2.
