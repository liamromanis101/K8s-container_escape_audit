# Affects 5.15 through 5.19 before 5.19.2; patched 5.15.61 / 5.19.2.
# ksmbd is NOT enabled by default on most distros -> exposure is rare but
# severe where present. Wiz: real-world exploitable systems uncommon.
# Compound check: kernel in 5.15..5.19 range AND ksmbd module loaded.
# -----------------------------------------------------------------------------
