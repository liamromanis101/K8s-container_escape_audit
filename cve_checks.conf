# ITScape — KVM/arm64 vGIC-ITS guest-to-host escape (Hyunwoo Kim / V4bel)
# Disclosed 2026-06-10 (oss-security), embargo expired. CVSS 9.3 CRITICAL.
# First public guest-to-host escape targeting KVM/arm64 (NOT QEMU userspace).
# UAF in vgic_its_invalidate_cache() double-put -> host-kernel code execution.
# Affected: arm64 KVM hosts only, from commit 8201d1028caa (2024-04-25, ~v6.9)
# through fix commit 13031fb6b835 (2026-06-05). x86 is NOT affected.
# Public PoC released. Highest-risk config: multi-tenant arm64 public cloud.
# Related: CVE-2026-46317 (DoS UAF) fixed by the same patchset.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-46316
name=ITScape
alias=ITScape KVM-arm64-escape vgic-its
cvss=9.3
severity=CRITICAL
check_type=kernel_version
introduced=6.9
fixed_versions=VERIFY  # fix commit 13031fb6b835 (mainline 2026-06-05); map to per-series + distro backports (RLC 9.6/9/10 patched; Rocky 8 NOT affected)
itw=no
poc_public=yes
cisa_kev=no
subsystem=arch/arm64/kvm/vgic
