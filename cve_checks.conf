fixed_versions=6.1:6.1.177 6.6:6.6.144 6.12:6.12.95 6.18:6.18.38 mainline:7.1.3  # VERIFY: LWN's 2026-07-04 batch also included 5.15.211/5.10.260, but introduced=6.0 implies pre-6.0 series (5.10, 5.15) are not in scope for THIS CVE — confirm which point releases actually carry the ipv6 fix vs. the unrelated KVM fix before trusting this list
upstream_ranges=introduced|6.0  # [NVD-ABSENT] No NVD CPE configuration published for CVE-2026-53362 as of this pass. Encode introduced floor only per this file's convention for recent NVD-absent CVEs; do not add fixed/range tokens beyond the confirmed stable point releases above until verified.
