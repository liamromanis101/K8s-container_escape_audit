# -----------------------------------------------------------------------------
# CrackArmor — AppArmor LSM kernel flaws (Qualys TRU; disclosed 2026-03-12/13)
# Nine vulnerabilities / eleven patches / eleven CVE IDs (all assigned by
# 2026-04-01). LPE-to-root + container-isolation bypass + KASLR/mem leak + DoS.
# Present since kernel v4.11 (2017). Anchor CVE-2026-23268 (confused deputy):
# securityfs apparmor .load/.replace/.remove world-writable (mode 0666), perms
# checked only on write; an unprivileged user redirects a cooperating setuid-root
# process (su/sudo demonstrated) to load/replace/remove AppArmor profiles.
# CVE-2026-23269 is the KASLR/kernel-memory leak used in the demonstrated Ubuntu
# 24.04.3 root chain; a double-free in aa_replace_profiles() gives the LPE.
# Fixes are distro-backported (Canonical/Debian/SUSE shipped simultaneously)
# -> vendor_defer, NOT a clean upstream version compare. Full set:
# CVE-2026-23268/23269/23403/23404/23405/23406/23407/23408/23409/23410/23411
# (+ userspace CVE-2026-35535 for su/sudo per the Ubuntu CrackArmor KB).
# Relevant here because AppArmor is Docker's default MAC layer and check 11 only
# reports AppArmor ENFORCEMENT STATUS, not a flaw in the AppArmor code itself.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-23268
name=CrackArmor AppArmor Confused Deputy
alias=CrackArmor CVE-2026-23269 CVE-2026-23403 CVE-2026-23404 CVE-2026-23405 CVE-2026-23406 CVE-2026-23407 CVE-2026-23408 CVE-2026-23409 CVE-2026-23410 CVE-2026-23411
cvss=7.8  # [approx/VERIFY] Qualys/CSA describe LPE-to-root severity (High/Critical); per-CVE NVD CVSS were not all published at time of writing. CONFIRM each of the 11 IDs against NVD / the Ubuntu CrackArmor KB before automated scoring.
severity=HIGH
check_type=kernel_version
introduced=4.11
fixed_versions=none
vendor_defer=ubuntu|ubuntu.com/security/vulnerabilities/crackarmor debian|security-tracker.debian.org(CrackArmor) suse|SUSE-SU(CrackArmor) amazon|ALAS(CrackArmor) azurelinux|github.com/microsoft/azurelinux/issues/16260 rhel|Red-Hat(CrackArmor) openshift|RHSA-openshift(CrackArmor)
itw=no
poc_public=no
cisa_kev=no
subsystem=security/apparmor (LSM)
module_names=none
mitigation=Apply your distribution's kernel update and reboot; also update sudo and util-linux (su) where fixes are published. Qualys states patching is the only assured fix — there is no robust interim workaround. Do NOT rely on AppArmor being in enforce mode as a mitigation; the flaws are in the AppArmor code itself.
what=CrackArmor is a set of nine confused-deputy / memory-safety flaws in the Linux kernel's AppArmor LSM (eleven upstream patches, eleven CVE IDs, all assigned by 2026-04-01), present since kernel v4.11 (2017). The anchor flaw CVE-2026-23268 exposes the securityfs policy-management files (/sys/kernel/security/apparmor/.load, .replace, .remove) world-writable (mode 0666) with permission checked only on write; an unprivileged user can redirect a cooperating privileged process (e.g. setuid-root su or sudo) to write to an open descriptor and thereby load, replace or remove AppArmor profiles. Companion flaws include a KASLR / kernel-memory information leak (CVE-2026-23269) and a double-free in aa_replace_profiles() that yields LPE.
impact=Local privilege escalation to root; removal or replacement of AppArmor confinement (disabling the MAC layer Docker relies on by default); kernel-memory/KASLR disclosure; and denial of service. Qualys demonstrated full root on Ubuntu 24.04.3 LTS (UAF chain) and Debian 13.1 (double-free), succeeding even with CONFIG_RANDOM_KMALLOC_CACHES enabled. Because AppArmor confines many container workloads, these flaws are a container-isolation bypass and escape primitive on affected hosts; Qualys estimated ~12.6 million exposed enterprise instances.
exploit=Requires unprivileged local access; the confused-deputy variant additionally needs a cooperating setuid-root helper (su/sudo demonstrated). Qualys withheld public exploit code to protect unpatched systems but published full mechanics, so independent reproduction is feasible. Rated High/Critical by distributions. No confirmed in-the-wild use at disclosure.
rec=1) Apply the current distribution kernel update and reboot — confirm the package version against your vendor's CrackArmor advisory (Ubuntu/Canonical, Debian, SUSE, Amazon, Azure Linux) rather than assuming a fix is present. 2) Update sudo and util-linux (su); the confused-deputy path needs a cooperating setuid-root writer. 3) On hosts where /sys/kernel/security is reachable, an unpatched kernel leaves the apparmor .load/.replace/.remove files world-writable — that securityfs permission state is the practical behavioural precondition to check (patched kernels tighten it). 4) Do NOT treat AppArmor enforce-mode as a mitigation (check 11 reports enforcement status, not this bug class). 5) Prioritise multi-tenant hosts, container nodes and CI runners.
notes=check_type=kernel_version with vendor_defer -> resolves to "defer: consult advisory" on ubuntu/debian/suse/amazon/azurelinux/rhel/openshift because fixes are distro-backported and not derivable from the base version string; on a vanilla kernel >= 4.11 with no upstream_ranges recorded it resolves to UNKNOWN (non-silent), NOT safe. This single row anchors the whole CrackArmor set (11 CVE IDs carried in alias for inventory/compliance visibility); split into per-CVE rows only if you need individual NVD CVSS scoring. VERIFY: exact fixed kernel package versions per distro and per-CVE NVD CVSS were not all published at time of writing — add distro_status=<distro>|<rel>|fixed|<ver> rows as each vendor advisory is confirmed. A dedicated securityfs-writability behavioural probe (checking mode of /sys/kernel/security/apparmor/.load|.replace|.remove) is a candidate script check, not yet added.

