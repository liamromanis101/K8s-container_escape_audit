what=Logic flaw in __ptrace_may_access(): get_dumpable() is consulted even for a task with no mm. During do_exit() the kernel runs exit_mm() before exit_files(), leaving a window where a privileged process has dropped its mm but still holds open file descriptors; the dumpable safeguard is skipped because mm is NULL. Paired with pidfd_getfd() (added v5.6), an unprivileged local user under the same uid can lift open file descriptors — including authenticated IPC channels — from a dying setuid process. Upstream fix (commit 31e62c2ebbfd) caches a user_dumpable bit on the task and requires CAP_SYS_PTRACE when no mm exists.
impact=Disclosure of sensitive files (e.g. /etc/shadow via chage, SSH host private keys via ssh-keysign) and arbitrary command execution as root (via hijacked dbus/systemd connections through accounts-daemon/pkexec) on default installs of several major distributions. On shared/multi-tenant container hosts any unprivileged foothold becomes a path to host root.
exploit=Reliable. Qualys developed four working exploits (chage, ssh-keysign, pkexec, accounts-daemon); public PoCs for the first two circulated within hours of the public commit. Local access only; no special capabilities required at default ptrace_scope=1. NOTE: pidfd_getfd() is the public path (v5.6+); kernels without it (e.g. some 4.18 lines) are not reachable by the current public PoC, but the underlying race is present and adapted ptrace_attach PoCs are in preparation.
rec=Apply the distribution kernel update (stable fixes: 5.10.256, 5.15.207, 6.1.173, 6.6.139, 6.12.89, 6.18.31, 7.0.8; commit 31e62c2ebbfd). Interim mitigation: set kernel.yama.ptrace_scope=2 (blocks the public pidfd_getfd path; scope=3 disables ptrace attach entirely). This is a workaround, not a fix — non-ptrace paths to the same bug may exist. Rotate SSH host keys and review credentials handled by setuid processes if untrusted local users had access during the exposure window.
 
