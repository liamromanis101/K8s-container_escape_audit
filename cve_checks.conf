# -----------------------------------------------------------------------------
# Januscape — KVM/x86 shadow-MMU guest-to-host escape (Hyunwoo Kim / V4bel)
# Disclosed 2026-07-06. UAF in KVM's legacy shadow MMU, shared code path
# between Intel and AMD backends; first publicly known guest-to-host KVM
# escape triggerable on both vendors. Vulnerable code dates to commit
# 2032a93d66fa (Aug 2010, ~2.6.36 era); fixed by commit 81ccda30b4e8,
# merged mainline 2026-06-19. Fixed stable kernels released 2026-07-04.
# x86-only; arm64 KVM has its own unrelated bug (see CVE-2026-46316 ITScape
# above). Trigger requires nested virtualization to be enabled on the host
# AND guest root — hardware EPT/NPT hosts still fall back to the vulnerable
# shadow MMU once a guest turns on nested virtualization. Public PoC panics
# the host reliably; researcher states a withheld exploit achieves full
# host code execution. Reported as a zero-day via Google kvmCTF.
# MUST be patched together with the companion CVE-2026-46113 below — the
# same shadow-MMU code path had two distinct UAFs disclosed months apart,
# and applying only one CVE's fix leaves the other exploitable.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-53359
name=Januscape
alias=Januscape KVM-shadow-mmu-escape
cvss=8.8  # [UNVERIFIED] SUSE-assigned CVSSv3.1 (9.3 under v4.0); NVD had not published its own score as of this pass — confirm against nvd.nist.gov before using for prioritisation
severity=CRITICAL
check_type=kernel_version
introduced=2.6.36  # approximates commit 2032a93d66fa (Aug 2010); NVD configuration not yet published, so treat as an approximation pending confirmation
fixed_versions=5.10:5.10.260 5.15:5.15.211 6.1:6.1.177 6.6:6.6.144 6.12:6.12.95 6.18:6.18.38 mainline:7.1.3
upstream_ranges=introduced|2.6.36  # [NVD-ABSENT] No NVD CPE configuration published for CVE-2026-53359 as of this pass. Known facts only: introduced ~2.6.36, fix commit 81ccda30b4e8 (mainline 2026-06-19), stable point releases 2026-07-04 per LWN/GKH announcement. DECISION: encode introduced floor only, mirroring the CVE-2026-46316 (ITScape) treatment for a recent, NVD-absent CVE — do not add range/fixed tokens beyond the confirmed stable-release list above until NVD publishes.
vendor_defer=rhel|RHSA-pending amazon|ALAS-pending suse|SUSE-SU-CVE-2026-53359 almalinux|almalinux-advisory-pending ubuntu|USN-pending
itw=no
poc_public=yes
cisa_kev=no
subsystem=arch/x86/kvm (shadow MMU, shared Intel/AMD code path)
module_names=kvm kvm_intel kvm_amd
mitigation=No in-container mitigation exists — this is a host-kernel/hypervisor bug reached from a guest VM, not from a container namespace. On the host: disable nested virtualization until patched: printf 'options kvm_intel nested=0\noptions kvm_amd nested=0\n' > /etc/modprobe.d/kvm-nested-disable.conf (requires kvm_intel/kvm_amd module reload, i.e. a reboot or unload/reload of running VMs, to take effect). This blocks the trigger path but is not a fix.
socket_af=none
socket_type=none
socket_proto=none
arch=x86_64  # gate: Intel/AMD hosts only; arm64 KVM is unaffected by this specific bug (see CVE-2026-46316 ITScape for the arm64 equivalent)
what=Januscape (CVE-2026-53359) is a use-after-free in the Linux kernel's KVM hypervisor, in the legacy shadow-MMU code shared between the Intel and AMD backends. A guest VM can corrupt the shadow-page state the host kernel uses to track guest memory mappings. The vulnerable code has existed since 2010; it is normally bypassed on modern hardware that defaults to hardware-assisted paging (EPT/NPT), but any guest that enables nested virtualization forces the host back through the shadow MMU, exposing the bug. Discovered and reported as a kvmCTF zero-day submission by Hyunwoo Kim (V4bel).
impact=Guest-to-host VM escape. The public PoC reliably panics the host — a denial-of-service against every other tenant VM on the same physical machine. The researcher states a separate, unreleased exploit achieves host code execution as root, which would expose every co-located guest to a fully compromised hypervisor. In container-adjacent contexts this matters most for VM-isolated container runtimes (Kata Containers, Firecracker-style microVMs) and any multi-tenant platform that exposes nested virtualization to customer-controlled guests.
exploit=High where nested virtualization is exposed to untrusted guests. Requires guest-side root (common on rented cloud instances) and nested virtualization enabled on the host; no cooperation from QEMU or other userspace VMM is needed — it is a pure in-kernel KVM bug. No public score from NVD yet; SUSE's independent assessment rates it 8.8 (v3.1)/9.3 (v4.0). Hosts that never enable nested virtualization for guests are not reachable via this specific path.
rec=1) Patch to a kernel containing commit 81ccda30b4e8: the 2026-07-04 stable releases (7.1.3, 6.18.38, 6.12.95, 6.6.144, 6.1.177, 5.15.211, 5.10.260) or your distribution's backport. 2) Apply the companion fix for CVE-2026-46113 (commit 0cb2af2ea66a) at the same time — confirm BOTH commits are present via package changelog, not uname -r alone, since backports can carry the fix under a different version number. 3) Until patched, disable nested virtualization for untrusted tenants (see mitigation). 4) Treat any host offering "bring your own hypervisor" or nested-virt CI/CD sandboxing to third parties as a priority patch target.
notes=Requires pairing with CVE-2026-46113 — the two CVEs patch two separate UAFs discovered months apart in the same shadow-MMU code path; RHEL/AlmaLinux/Rocky/Oracle Linux 10 and Ubuntu 22.04 have KernelCare livepatch coverage for both as of 2026-07-07 per TuxCare. cvss, upstream_ranges, and several vendor_defer entries are marked VERIFY/UNVERIFIED above pending NVD publication — re-confirm before this entry is relied on for automated severity scoring.

