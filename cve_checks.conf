what=CVE-2022-0492 is an improper-authentication flaw in the Linux kernel cgroup v1 release_agent feature. cgroup_release_agent_write() did not verify that the writing process had the privileges normally required to set the release_agent program. A process with CAP_SYS_ADMIN — or one able to gain it within a new user+cgroup namespace on misconfigured systems — could set the cgroup v1 release_agent to an attacker-controlled program, which the kernel then executes on the host (outside all container namespaces) when the last task in a cgroup exits.
impact=Container escape to host code execution as root. Where a container has CAP_SYS_ADMIN and a writable cgroup v1 hierarchy (or can create the necessary namespaces), the release_agent mechanism yields full host compromise with no memory-corruption exploit required. Listed in the CISA Known Exploited Vulnerabilities catalog.
exploit=High and well-tooled. The release_agent escape is implemented as a one-click technique in CDK and deepce and is one of the most widely documented container escapes. Requires CAP_SYS_ADMIN (or an equivalent path to it) and a writable cgroup v1 release_agent.
rec=1) Migrate workloads to cgroup v2, which has no release_agent. 2) Mount cgroupfs read-only inside containers. 3) Drop CAP_SYS_ADMIN from application containers. 4) Apply seccomp to block mount(2) and unshare(2)/clone(2) with namespace flags. 5) Enforce Pod Security Admission at 'restricted'. The live detection is check_cgroup_release_agent (check 12), which flags a writable release_agent directly.
notes=check_type=manual: detection is the writable-release_agent behavioural probe (check 12) and the /sys mount logic (check 19), not a kernel version comparison. This row makes the CVE id appear in compliance/inventory output.

# -----------------------------------------------------------------------------
# PinTheft is a Linux kernel local privilege escalation that chains an RDS 
# zerocopy reference-count bug with io_uring fixed buffers to overwrite the 
# page cache of a SUID-root binary. The attack chain repeatedly "steals" pin 
# references through the RDS zerocopy failure path; after the references are 
# drained, io_uring still believes it holds a valid page, but 
# that physical page can now be freed and reused by the page cache
# -----------------------------------------------------------------------------
cve_id=CVE-2026-43494
name=PinTheft (RDS zerocopy + io_uring page-cache overwrite)
cvss=7.8
severity=HIGH
check_type=compound
introduced=4.17
fixed_versions=VERIFY
upstream_ranges=introduced|4.17 range|4.17|5.10.258 range|5.11|5.15.209 range|5.16|6.1.175 range|6.2|6.6.141 range|6.7|6.12.91 range|6.13|6.18.33 range|6.19|7.0.10  # [verified] NVD Configuration 1 (linux:linux_kernel), CVE-2026-43494 PinTheft. introduced 4.17 confirmed by NVD (matched existing). Prior fixed_versions=VERIFY placeholder now superseded by authoritative NVD ranges. Same 2026 stable-wave endpoints (5.10.258/6.1.175/etc.). Version half of compound; rds/rds_tcp module + io_uring reachability are the other half (see checks 47/48).
vendor_defer=rhel|Red-Hat-CVE-2026-43494 amazon|ALAS-CVE-2026-43494 suse|SUSE-SU-CVE-2026-43494
itw=no
poc_public=yes
cisa_kev=no
subsystem=net/rds
module_names=rds rds_tcp
mitigation=If RDS is not in use (it rarely is outside Oracle RAC/InfiniBand HPC clusters), blacklist the modules: printf 'install rds /bin/false\ninstall rds_tcp /bin/false\n' > /etc/modprobe.d/pintheft.conf && rmmod rds_tcp rds 2>/dev/null. On kernels 6.6+ also gate the second half of the chain by disabling io_uring with sysctl kernel.io_uring_disabled=2. Either control alone breaks the exploit; many distros (e.g. Ubuntu) already blacklist RDS by default via /etc/modprobe.d/blacklist-rare-network.conf.
socket_af=none
socket_type=none
socket_proto=none
what=A reference-count flaw in the Linux kernel RDS (Reliable Datagram Sockets) zerocopy send path. When rds_message_zcopy_from_user() pins user pages and a later page faults, the error path drops pages it already pinned while op_nents is not reset, so subsequent RDS message cleanup drops the same references again. Each failed zerocopy send steals one pin reference from the first page. The public exploit chains this with io_uring fixed buffers (REGISTER_BUFFERS): after the pin references are drained, io_uring still believes it holds a valid page, but that physical page can be freed and reused by the page cache, yielding a controlled overwrite of the in-memory page cache of a SUID-root binary. Same end primitive as Copy Fail (CVE-2026-31431) but reached through a different subsystem. The underlying RDS bug dates to kernel 4.17 (2018); the working PoC additionally depends on io_uring features present in roughly 6.6+.
impact=Any unprivileged local user on an affected host gains root by overwriting a setuid binary in the page cache. The on-disk file is unchanged, so on-disk integrity checks miss it. The page cache is shared across the host, so on multi-tenant nodes, CI runners, and container hosts this is also a container-escape / node-compromise vector. Two independent prerequisites must both hold: the rds/rds_tcp modules must be loadable AND io_uring must be reachable.
exploit=Reliable and deterministic. A public PoC and technical write-up (V12 Security / Aaron Esau) are available; no race-win retries needed once both prerequisites are met. Requires only an unprivileged local shell. Mitigated by default on distributions that blacklist RDS or disable io_uring, which is why default Ubuntu/CloudLinux configs are reported safe.
rec=Apply the distribution kernel update that backports the upstream RDS zerocopy fix (candidate posted to netdev 2026-05-05). Confirm the fixed package version against your distribution's security tracker before relying on a patched verdict, as backports vary by vendor. Live detection is supported by the dangerous-modules audit (check 47, rds/rds_tcp) and the io_uring reachability probe (check 48); a finding is most actionable when both gates are present.
notes=Also tracked as QVD-2026-27616. Two-gate CVE: cross-reference check 47 (rds/rds_tcp module presence) with check 48 (io_uring reachability). If either gate is closed (RDS blacklisted, or kernel.io_uring_disabled=2), the documented exploit chain does not apply on that host.

