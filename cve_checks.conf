# -----------------------------------------------------------------------------
# containerd CRI checkpoint import — image cache poisoning / cross-pod RCE
# CVE-2026-50195 (GHSA-cvxm-645q-p574). AWS bulletin 2026-046. CVSS 8.8.
# The CRI plugin fails to validate image references inside a checkpoint image's
# config; an attacker who can create pods imports a crafted checkpoint, forcing
# containerd to pull an attacker image and bind it to an arbitrary local tag,
# poisoning the node image cache. Other pods on the node using that tag with an
# IfNotPresent/Never pull policy then run the attacker image -> cross-pod code
# execution. Fixed: containerd 2.3.2 / 2.2.5 / 2.1.9 / 2.0.10 / 1.7.33.
# Preconditions: checkpoint/restore enabled (CRIU) + pod-create permission.
# Userspace runtime CVE -> check_type=manual, cross-referenced against check 52.
# -----------------------------------------------------------------------------
