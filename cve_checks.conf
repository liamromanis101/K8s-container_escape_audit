what=Use-after-free in nf_tables caused by an inverted genmask activity check in nft_map_catchall_activate() (the abort-path counterpart to nft_mapelem_activate()). The buggy check skips inactive catchall map elements and processes active ones — the opposite of what is required — so when a DELSET is aborted, nft_setelem_data_activate() is never called for the catchall element. For NFT_GOTO verdict elements, chain->use is never restored, and each abort cycle permanently decrements it. Once chain->use hits zero, DELCHAIN frees the chain while catchall verdict elements still reference it: a use-after-free. The upstream fix removes a single negation (one '!'). Patched upstream 2026-02-05, commit f41c5d151078 (6.19).
impact=Unprivileged local user escalates to root (UID 0) with >99% reliability per the public exploits. In containerized scenarios this is a direct container escape, compromising the host kernel and co-located tenants. Reachable on distributions that enable CONFIG_USER_NS and CONFIG_NF_TABLES — the default on most desktops and many servers.
exploit=High and weaponized. FuzzingLabs published a working RHEL 10 root exploit 2026-04-16; Exodus Intelligence published a full technical walkthrough 2026-06-08 with >99% reliability across Ubuntu 22.04/24.04 and Debian Bookworm/Trixie. Requires local access plus nft interaction via a user namespace. Ubuntu 24.04's unprivileged-userns restrictions can be bypassed (e.g. aa-exec -p trinity -- unshare -Urmin /bin/sh). Note: the abort-path break instructions also introduced a separate bug, CVE-2026-23278.
rec=Apply the distribution kernel update (upstream fix commit f41c5d151078, in 6.19; Debian Bookworm 6.1.164-1, Trixie 6.12.73-1; Ubuntu 22.04 5.15.0-174.184, 24.04 6.8.0-107.107) and REBOOT. Decide exposure from the vendor advisory + installed package, not the upstream version string, since distros backport. Interim: restrict unprivileged user namespaces with user.max_user_namespaces=0 (RHEL) or kernel.unprivileged_userns_clone=0 (Debian/Ubuntu), and ensure non-admin users cannot interact with nft.
 
