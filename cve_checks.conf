what=CVE-2026-53489 is a symlink-following flaw in containerd's CRI checkpoint restore path: a symlink embedded in a checkpoint can cause containerd to read a file at an attacker-chosen location on the host during restore, disclosing arbitrary host file contents.
impact=Arbitrary host file read (e.g. secrets, tokens, keys) from within a restore operation — an information-disclosure primitive that aids further escalation. Gated on checkpoint/restore being enabled and the attacker being able to import a checkpoint.
exploit=Requires checkpoint/restore enabled (CRIU) and checkpoint-import access. No public PoC captured; CVSS not yet confirmed.
rec=1) Upgrade containerd to >= 2.3.2 / 2.2.5 / 2.1.9 / 2.0.10 / 1.7.33. 2) Disable checkpoint/restore if unused. 3) Restrict RBAC; admit only trusted images. 4) check 52 cross-references this CVE against the reachable containerd version.
notes=check_type=manual userspace runtime CVE. Keyed off check 52's CONTAINERD_CRI_VERDICT with the rest of the CRI cluster. Disclosed 2026-06-18 (AWS bulletin 2026-046). cvss=VERIFY — populate once the GHSA/NVD score is confirmed.

