component_affected=>=3.4.0,<3.29.0 (also kata confidential-containers >=0.9.0,<0.20.0)
component_fixed=3.29.0  # [verified] NVD Configuration 1, CVE-2026-41326: kata_containers 3.4.0->3.29.0 and confidential_containers 0.9.0->0.20.0. Both are component (software) version ranges, NOT kernel — this is a check_type=manual entry. confidential-containers fixed in 0.20.0.
what=CVE-2026-41326 is an authorization-bypass and symlink-following vulnerability (CWE-61) in the CopyFile API of the Kata Containers kata-agent (the guest-side ttrpc/gRPC interface the host shim uses to manage container lifecycle and transfer files). The agent's Rego/OPA policy engine validates the destination path of a write but ignores the file type and payload. An attacker with host-level access to the kata-agent socket first issues a CopyFile request creating a symlink in an allowed directory (e.g. /run/kata-containers/shared/containers/) pointing to a restricted guest file, then issues a second CopyFile write to that symlink, which the agent blindly follows, overwriting the target. Affects Kata 3.4.0 through 3.28.0; fixed in 3.29.0.
impact=A compromised or malicious host can write to arbitrary locations inside the guest workload image — overwriting guest binaries (e.g. /bin/bash), injecting code, altering execution flow, or exfiltrating data. The impact is most severe for Confidential VMs (CVMs), whose entire security model assumes the guest is isolated from an untrusted host; this flaw breaks that boundary. It is a host-to-guest integrity violation rather than a guest-to-host escape.
exploit=Public technical writeups and a Python ttrpc/gRPC PoC exist (two CopyFile calls: create symlink, then write through it). Requires host-side access to the kata-agent communication socket — i.e. an already-compromised or malicious host in the CVM threat model. CVSS 4.0 base 8.2 (VC:N/VI:H/SC:H).
rec=1) Upgrade Kata Containers to >= 3.29.0 (also shipped in OpenShift 4.19.34 and equivalent vendor releases). 2) Restrict and authenticate access to the kata-agent ttrpc/gRPC socket; ensure only the trusted shim can reach it. 3) Where a custom agent policy is used, validate symlink targets and reject CopyFile writes whose resolved path escapes the permitted directory. 4) For CVM deployments, treat any pre-3.29.0 agent as integrity-compromised. The script check_kata_agent_socket flags the presence/accessibility of the kata-agent socket from this context.
notes=check_type=manual: this is a userspace runtime CVE that does not map to a kernel version or loadable module. The engine emits a tracking finding at the configured severity; behavioural detection is in check_kata_agent_socket. fixed_versions=none refers to the KERNEL (n/a); the package fix is recorded in component_fixed=3.29.0.

