what=CVE-2022-47939 is a use-after-free in the Linux kernel's in-kernel SMB3 server (ksmbd), introduced in kernel 5.15. In fs/ksmbd/smb2pdu.c, when handling SMB2_TREE_DISCONNECT requests the code calls ksmbd_tree_conn_disconnect() to terminate the tree connection but does not set work->tcon to NULL, leaving a dangling pointer that is subsequently dereferenced. The flaw can be triggered remotely without authentication by causing SMB2_TREE_DISCONNECT commands to be reprocessed. Affects 5.15 through 5.19 before 5.19.2; fixed in 5.15.61 and 5.19.2.
impact=Unauthenticated remote attackers can cause kernel OOPS and potentially execute arbitrary code in kernel context on hosts running the ksmbd module exposed to the network (TCP 445), achieving complete system compromise with no user interaction. In container hosts or images that load ksmbd, this is a kernel-level RCE reachable over the network; container relevance is via hosts/images that enable ksmbd. ksmbd is not enabled by default on most distributions, so exposed systems are relatively rare.
exploit=ZDI scored this 10.0 (NVD 9.8). No public proof-of-concept was released at disclosure and active exploitation has not been observed, partly because ksmbd is new (since 5.15) and rarely enabled. Where ksmbd IS enabled and network-reachable, the impact is unauthenticated remote kernel code execution.
rec=1) Update the kernel to 5.15.61+ or 5.19.2+ (or any later series, which are unaffected). 2) If SMB serving via the in-kernel ksmbd is not required, unload and blacklist the module: 'rmmod ksmbd 2>/dev/null; echo install ksmbd /bin/false > /etc/modprobe.d/ksmbd.conf'. Prefer userspace Samba where an SMB server is needed. 3) Restrict TCP/445 exposure with host firewalling and network policy. 4) Verify ksmbd is not auto-loaded in container images.
notes=Amazon Linux (AL1, AL2 core/extras, AL2023) report Not Affected. ksmbd module presence is now covered by the dangerous-modules audit (check_kh_dangerous_modules). The compound check flags kernel in the 5.15..5.19 affected range AND the ksmbd module loaded; on kernels >= 6.x the version check passes (not affected) regardless of module state.

