# GhostLock — CVE-2026-43499, futex priority-inheritance UAF
# Disclosed ~2026-07-08 by researchers at Nebula Security (team VEGA),
# reported via Google kernelCTF ($92,337 award). A ~15-year-old flaw in
# the kernel's futex priority-inheritance handling; triggerable via
# ordinary threading calls from any local process, no special permission,
# setting, or network access required. Working exploit reported 97%
# reliable and also escapes containers. No complete configuration-level
# workaround exists. The original upstream fix introduced a separate
# regression/crash bug, CVE-2026-53166 — confirm you have the FINAL
# cleaned-up fix, not just "a patch", before treating a host as remediated.
# Distro rollout uneven as of disclosure: some newest-release and cloud
# kernels patched, but several LTS lines still vulnerable or in progress.
# Also documented as the second half of an exploit chain Nebula calls
# IonStack, paired with a Firefox sandbox-escape bug (CVE-2026-10702,
# out of scope for this kernel-focused database).
# -----------------------------------------------------------------------------
