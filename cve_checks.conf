what=CVE-2026-41579 is a low-severity flaw in runc's container rootfs preparation. When setting up the container rootfs, setupPtmx and setupDevSymlinks create /dev symlinks; a malicious image supplying a crafted /dev symlink could obtain limited write access to the host filesystem. It is the same class of bug as the November 2025 runc masked-path/symlink CVEs (CVE-2025-31133, CVE-2025-52565, CVE-2025-52881) and was missed when that rootfs-preparation hardening was done.
impact=Limited and, per runc's own analysis, too constrained to be problematic in practice — the write access is narrow rather than an arbitrary host-file overwrite. Still a defence-in-depth regression in the /dev setup path. Container-escape relevance is bounded.
exploit=Low. Reported by multiple people; released publicly with no embargo precisely because severity is low. No weaponised PoC. CVSS 3.3.
rec=1) Update runc to >= 1.4.3 or >= 1.5.0-rc3 (1.5.0 expected shortly after). Ensure containerd/Docker use the patched runc. 2) Run only trusted images. 3) check_runc_masked_path detects the broader vulnerable-runc-version condition and the related masked-path CVEs.
notes=check_type=manual userspace runtime CVE. The runc version detection in check_runc_masked_path is the practical behavioural signal; this row exists so the specific CVE id appears in inventory.

# -----------------------------------------------------------------------------
# cgroup v1 release_agent escape — CVE-2022-0492 (CISA KEV)
# Improper authentication in the cgroup v1 release_agent path: a process with
# CAP_SYS_ADMIN (or that can create a cgroup namespace) could set release_agent
# and have the kernel execute a program on the host. Listed in CISA KEV.
# Already detected behaviourally by check_cgroup_release_agent (check 12) and
# the /sys release_agent mount logic (check 19). Added here so the specific
# CVE id appears in reports. check_type=manual (the live detection is the
# writable-release_agent probe, not a kernel version test).
# -----------------------------------------------------------------------------
cve_id=CVE-2022-0492
name=cgroup release_agent Escape
alias=cgroups-v1-release-agent
cvss=7.0
severity=HIGH
check_type=manual
introduced=0
fixed_versions=none
itw=yes
poc_public=yes
cisa_kev=yes
subsystem=kernel/cgroup release_agent
module_names=none
mitigation=Migrate to cgroup v2 (no release_agent); mount cgroupfs read-only; drop CAP_SYS_ADMIN; block mount(2) via seccomp
socket_af=none
socket_type=none
socket_proto=none
what=CVE-2022-0492 is an improper-authentication flaw in the Linux kernel cgroup v1 release_agent feature. cgroup_release_agent_write() did not verify that the writing process had the privileges normally required to set the release_agent program. A process with CAP_SYS_ADMIN — or one able to gain it within a new user+cgroup namespace on misconfigured systems — could set the cgroup v1 release_agent to an attacker-controlled program, which the kernel then executes on the host (outside all container namespaces) when the last task in a cgroup exits.
impact=Container escape to host code execution as root. Where a container has CAP_SYS_ADMIN and a writable cgroup v1 hierarchy (or can create the necessary namespaces), the release_agent mechanism yields full host compromise with no memory-corruption exploit required. Listed in the CISA Known Exploited Vulnerabilities catalog.
exploit=High and well-tooled. The release_agent escape is implemented as a one-click technique in CDK and deepce and is one of the most widely documented container escapes. Requires CAP_SYS_ADMIN (or an equivalent path to it) and a writable cgroup v1 release_agent.
rec=1) Migrate workloads to cgroup v2, which has no release_agent. 2) Mount cgroupfs read-only inside containers. 3) Drop CAP_SYS_ADMIN from application containers. 4) Apply seccomp to block mount(2) and unshare(2)/clone(2) with namespace flags. 5) Enforce Pod Security Admission at 'restricted'. The live detection is check_cgroup_release_agent (check 12), which flags a writable release_agent directly.
notes=check_type=manual: detection is the writable-release_agent behavioural probe (check 12) and the /sys mount logic (check 19), not a kernel version comparison. This row makes the CVE id appear in compliance/inventory output.

