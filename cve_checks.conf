# Podman malicious WORKDIR symlink host write — CVE-2026-55686
# GHSA-q6r4-3wmg-fwcq. Low/Moderate (~5.3). Running a malicious container image
# whose WORKDIR path contains a symlink can create a directory, or (via a race
# with a host process mutating the tree during dereference) modify ownership,
# on the HOST filesystem during host-side workdir creation.
# Userspace runtime CVE -> check_type=manual; same mechanism class as the runc
# masked-path / symlink races already covered behaviourally by
# check_runc_masked_path.
# -----------------------------------------------------------------------------
