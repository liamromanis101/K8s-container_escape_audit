# ZDI-22-1690 (2022-12-22), CVE assigned 2022-12-23. NVD CVSS 9.8 (ZDI 10.0).
# UAF/OOPS in fs/ksmbd/smb2pdu.c smb2_tree_disconnect: work->tcon not NULLed
# after ksmbd_tree_conn_disconnect(). Unauthenticated remote kernel RCE on
