component_fixed=3.29.0
what=CVE-2026-41326 is an authorization-bypass and symlink-following vulnerability (CWE-61) in the CopyFile API of the Kata Containers kata-agent (the guest-side ttrpc/gRPC interface the host shim uses to manage container lifecycle and transfer files). The agent's Rego/OPA policy engine validates the destination path of a write but ignores the file type and payload. An attacker with host-level access to the kata-agent socket first issues a CopyFile request creating a symlink in an allowed directory (e.g. /run/kata-containers/shared/containers/) pointing to a restricted guest file, then issues a second CopyFile write to that symlink, which the agent blindly follows, overwriting the target. Affects Kata 3.4.0 through 3.28.0; fixed in 3.29.0.
impact=A compromised or malicious host can write to arbitrary locations inside the guest workload image — overwriting guest binaries (e.g. /bin/bash), injecting code, altering execution flow, or exfiltrating data. The impact is most severe for Confidential VMs (CVMs), whose entire security model assumes the guest is isolated from an untrusted host; this flaw breaks that boundary. It is a host-to-guest integrity violation rather than a guest-to-host escape.
exploit=Public technical writeups and a Python ttrpc/gRPC PoC exist (two CopyFile calls: create symlink, then write through it). Requires host-side access to the kata-agent communication socket — i.e. an already-compromised or malicious host in the CVM threat model. CVSS 4.0 base 8.2 (VC:N/VI:H/SC:H).
rec=1) Upgrade Kata Containers to >= 3.29.0 (also shipped in OpenShift 4.19.34 and equivalent vendor releases). 2) Restrict and authenticate access to the kata-agent ttrpc/gRPC socket; ensure only the trusted shim can reach it. 3) Where a custom agent policy is used, validate symlink targets and reject CopyFile writes whose resolved path escapes the permitted directory. 4) For CVM deployments, treat any pre-3.29.0 agent as integrity-compromised. The script check_kata_agent_socket flags the presence/accessibility of the kata-agent socket from this context.
notes=check_type=manual: this is a userspace runtime CVE that does not map to a kernel version or loadable module. The engine emits a tracking finding at the configured severity; behavioural detection is in check_kata_agent_socket. fixed_versions=none refers to the KERNEL (n/a); the package fix is recorded in component_fixed=3.29.0.

# -----------------------------------------------------------------------------
# containerd numeric-User runAsNonRoot bypass — CVE-2026-46680
# GHSA-fqw6-gf59-qr4w. Moderate. A numeric User directive that cannot be parsed
# as a 32-bit integer is treated as a username; a crafted image /etc/passwd that
# maps that string to UID 0 causes the container to run as root, bypassing the
# Kubernetes runAsNonRoot restriction. Fixed in containerd 1.7.32 / 2.0.9 /
# 2.2.4 / 2.3.1 (2.1.x is EOL, no fix). Related older advisory: CVE-2024-40635.
# Userspace runtime CVE -> check_type=manual.
# -----------------------------------------------------------------------------
cve_id=CVE-2026-46680
name=containerd runAsNonRoot Bypass
alias=containerd-uid-bypass GHSA-fqw6-gf59-qr4w CVE-2024-40635
cvss=7.3
severity=HIGH
check_type=manual
introduced=0
fixed_versions=none
itw=no
poc_public=no
cisa_kev=no
subsystem=containerd user-id handling
module_names=none
mitigation=Upgrade containerd to >= 1.7.32 / 2.0.9 / 2.2.4 / 2.3.1; enforce a numeric runAsUser in the Pod securityContext; use Kubernetes >= 1.34; only run trusted images
socket_af=none
socket_type=none
socket_proto=none
component=containerd
component_affected=<1.7.32 (and 2.0.x<2.0.9, 2.2.x<2.2.4, 2.3.x<2.3.1; 2.1.x EOL)
component_fixed=1.7.32
what=CVE-2026-46680 is an input-validation bug in containerd. When a container is launched with a numeric User directive that cannot be parsed as a 32-bit integer (e.g. a value larger than 2147483647), containerd incorrectly treats the numeric string as a username and resolves it against the container image's /etc/passwd. A crafted image that maps that large numeric string to root (UID 0) causes the container to ultimately run as root. The closely related earlier advisory is CVE-2024-40635 (same class, UID overflow / wraparound).
impact=Complete bypass of the Kubernetes runAsNonRoot security control: a workload that is supposed to be forced non-root runs as UID 0 instead. Combined with any other in-container-root escalation path this becomes a force multiplier toward container escape and host compromise. Requires the ability to run a crafted/untrusted image (or a malicious image author).
exploit=No public exploit code; the mechanism is straightforward (image USER set to e.g. 4294967296 plus a matching /etc/passwd entry mapping it to root). Moderate severity; gated on running untrusted images and on the cluster relying on runAsNonRoot rather than an explicit numeric runAsUser.
rec=1) Upgrade containerd to >= 1.7.32, 2.0.9, 2.2.4, or 2.3.1 (containerd 2.1.x is end-of-life with no fix — migrate off it). 2) Enforce a specific numeric runAsUser in the Pod securityContext, which overrides the image USER directive and prevents the bypass. 3) Kubernetes >= 1.34 enforces runAsNonRoot correctly regardless of this bug. 4) Admit only trusted images; use OPA/Kyverno to reject UID values >= 2147483647. 5) check_user_namespace_mapping (check 27) flags running as UID 0 without userns remapping, the observable end-state of this bypass.
notes=check_type=manual userspace runtime CVE. component_fixed records the containerd package fix; fixed_versions=none refers to the (n/a) kernel. The numeric finding ID will derive from the subsystem slug.

