name=Podman WORKDIR Symlink Host Write
alias=podman-workdir-symlink GHSA-q6r4-3wmg-fwcq
cvss=5.3
severity=MEDIUM
check_type=manual
introduced=0
fixed_versions=none
itw=no
poc_public=no
cisa_kev=no
subsystem=podman/libpod workdir creation
module_names=none
mitigation=Upgrade Podman/libpod to the fixed release; only run trusted images; avoid images with symlinked WORKDIR
socket_af=none
socket_type=none
socket_proto=none
