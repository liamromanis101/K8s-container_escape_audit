name=IPv6 Fragmentation Container Escape
alias=ipv6-frag-escape ipv6_frag_escape  # [UNCONFIRMED alias] see header note — likely but not verified to be the same bug as RHSB-2026-009 / Traficom's pre-CVE "ipv6_frag_escape" advisory
cvss=VERIFY  # [NEEDS CONFIRMATION] not captured from public sources at time of writing; Red Hat rates the pre-CVE issue "Important"
severity=CRITICAL
