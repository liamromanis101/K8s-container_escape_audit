what=Fragnesia (CVE-2026-46300) is a DirtyFrag-family local privilege escalation disclosed 2026-05-13 by William Bowling / V12 Security. The root defect is in core skbuff: skb_try_coalesce() can attach paged frags from one skb to another but loses the SKBFL_SHARED_FRAG marker. ESP input checks skb_has_shared_frag() before deciding whether a nonlinear skb can skip skb_cow_data(); if TCP receive coalescing moved shared frags into an unmarked skb, ESP decrypts in place over page-cache-backed frags, letting an unprivileged user write into the page cache of a root-owned read-only file. Emerged as an unintended side effect of the Dirty Frag fix (f4c50a4034e6), which first made the SHARED_FRAG bit actually checked at decrypt time. Upstream fix commit f84eca581739.
impact=Local privilege escalation to root by page-cache poisoning of a setuid binary; on-disk file unchanged so integrity tooling misses it. Container-escape / node-compromise vector on multi-tenant hosts. Kernels that already received the Dirty Frag fix remain vulnerable until this and the DirtyClone follow-up are also applied — the full DirtyFrag-family patch set is required for protection.
exploit=High. Public PoC (github.com/v12-security/pocs, fragnesia). Deterministic, no race condition. The PoC requires CONFIG_INET_ESPINTCP (espintcp) to reach the bug, so kernels built without it block this specific exploit, though the underlying skbuff defect may be reachable via other paths. Reachable by unprivileged users via namespace-local CAP_NET_ADMIN where unprivileged user namespaces are enabled.
rec=Apply the distribution kernel update (Debian Bullseye 5.10.257-1, Bookworm 6.1.174-1, Trixie 6.12.90-2; AlmaLinux 8/9/10 patched kernels per almalinux.org advisory; upstream fix commit f84eca581739) and REBOOT. Interim: the Dirty Frag esp4/esp6 blacklist also blunts this; additionally blacklist espintcp, and/or disable unprivileged user namespaces. WARNING: blacklisting breaks IPsec/VPN. Verify operational impact first.
notes=Same fix series as DirtyClone (CVE-2026-43503): the kernel CNA assigned CVE-2026-43503 to the SECOND Fragnesia commit (48f6a5356a33), so 46300 and 43503 are two commits of one remediation and share Debian advisories (DSA-6295-1 etc.). Ubuntu tracks both under the name "Fragnesia". Must be shipped together with CVE-2026-43284 (Dirty Frag), whose fix is what makes the SHARED_FRAG bit checked at decrypt time. The compound check should flag kernel before the per-series fix AND presence of esp4/esp6/espintcp; the primary defect is in core skbuff (not module-gated), so kernel version is authoritative. Cross-ref: CVE-2026-43284, CVE-2026-43500, CVE-2026-43503.

