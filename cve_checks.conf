#         CVE-2022-47939  ksmbd SMB2_TREE_DISCONNECT UAF (remote kernel RCE)
#
#   (b) Container-runtime / userspace CVEs that do NOT reduce to a kernel
#       version or module test. These use check_type=manual (see engine):
#       the engine emits a tracking finding (severity from this entry) and
#       prints the detection guidance in the 'rec' field. The optional
#       'component' and 'component_fixed' keys document the affected package.
#         CVE-2026-41326  Kata Containers CopyFile policy subversion (symlink)
