what=Logic flaw in __ptrace_may_access(). When a privileged process drops its credentials, a narrow window leaves it reachable via ptrace-family operations even though its dumpable flag should have closed that path. Paired with pidfd_getfd(), an unprivileged local user can capture open file descriptors and authenticated IPC channels from a dying setuid process and reuse them under their own UID.
impact=Disclosure of sensitive files (e.g. /etc/shadow, SSH host private keys) and arbitrary command execution as root on default installs of several major distributions. On shared/multi-tenant container hosts any unprivileged foothold becomes a path to host root.
exploit=Reliable. Working exploits against chage, ssh-keysign, pkexec, and accounts-daemon are public. Local access only; no special capabilities required at default ptrace_scope=1.
rec=Apply the distribution kernel update. Interim mitigation: set kernel.yama.ptrace_scope=2 (blocks the public pidfd_getfd path). Rotate SSH host keys and review credentials handled by setuid processes if untrusted local users had access during the exposure window.
 
