name: SLSA provenance
on:
  push:
    tags:
      - "v*"
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Hash release artifacts
        id: hash
        run: |
          set -euo pipefail
          files="container_escape_audit.sh cve_checks.conf"
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            container_escape_audit.sh
            cve_checks.conf
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read    # To read the workflow path.
      id-token: write  # To sign the provenance via Sigstore/OIDC.
      contents: write  # To upload the provenance file to the release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      compile-generator: true
